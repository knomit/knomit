# A mission repo: coordination signals for one mission, separate from any
# knowledge base, plus one topic of annotations on the target knowledge base's
# facts. Every coordination topic holds signals (kind pragmatic, type signal):
# consumed once, never believed. The knowledge itself goes to the target
# knowledge base the charter names. Read README.md before editing.
id: mission
name: Mission
description: Coordination signals for one mission (tasks, claims, working copies, acknowledgements), and annotations on the target knowledge base's facts. The knowledge itself lives in the target knowledge base.

# Set these ONCE, when the mission repo is created, and do not change them
# mid-mission (README: "Set it once and forget").
#   consensus: auto  - on the knomit instance that hosts this repo (no origin),
#                      every branch a peer pushes is merged automatically.
#                      A GitHub-hosted mission repo drops this line.
#   conflicts        - how a path both sides changed is settled, and recorded.
#   sync             - push: realtime sends every commit on this instance's own
#                      agent branch out about 1 s after it lands; pull: realtime
#                      runs a sync round every [git].realtime_pull_interval
#                      (3 s by default) instead of every 300 s. The claim window
#                      (WINDOW_SECONDS in claims.js) is derived from these
#                      (README "The timing rule"). On a forge, read README
#                      "GitHub-hosted" first: it costs requests.
attributes:
  consensus: auto
  conflicts:
    facts: merge
    state: consensus
  sync:
    push: realtime
    pull: realtime

topics:
  # --- Pattern 1: claim / wait / take (a heuristic; README "Two ways to take") ---
  tasks:
    description: Generally available work, claimed with the claim protocol. The category is the lane (tasks/<lane>/). One entity, the task id.
    attributes:
      learn_dedup: off
    validations:
      - name: signal
        message: a task is a signal (kind pragmatic, type signal)
        rule: "fact.type === 'signal'"
      - name: one-id
        message: a task carries exactly one entity, its task id
        rule: "fact.entities.length === 1"
      - name: expires
        message: a task must carry expires
        rule: "typeof fact.expires === 'string' && fact.expires !== ''"
    triggers:
      # Expiry is a script (ruling R2), inline because it is one line.
      - name: expire
        on: due
        match: "tasks/**"
        do: script
        js: "knomit.retract(change.path)"
      # Every machine that wants work claims a new task.
      - name: offer
        on: learn
        match: "tasks/**"
        do: script
        script: claims

  claims:
    description: Intentions to take a task, claims/<task-id>/<agent-id>/. A claim's expires is its decision timer.
    attributes:
      learn_dedup: off
    validations:
      - name: signal
        message: a claim is a signal
        rule: "fact.type === 'signal'"
      - name: expires
        message: a claim must carry expires (it is the claim's timer)
        rule: "typeof fact.expires === 'string' && fact.expires !== ''"
    triggers:
      # My claim's window is over: decide (take, wait, or withdraw).
      - name: decide
        on: due
        match: "claims/*/{agent}/**"
        do: script
        script: claims

  inbox:
    description: Per-agent queues. inbox/<agent-id>/working/ is the queue (tasks an agent took or was assigned); inbox/<agent-id>/active/ holds the copies a session has taken from it. expires is a lease, never a deadline.
    attributes:
      learn_dedup: off
    validations:
      - name: signal
        message: the inbox holds signals only
        rule: "fact.type === 'signal'"
      - name: expires
        message: a working copy must carry expires (its lease; README "The queue")
        rule: "typeof fact.expires === 'string' && fact.expires !== ''"
    triggers:
      # The backstop: two copies (working or active) of one task -> the
      # lower-ranked holder backs off.
      - name: dup-check
        on: learn
        match: "inbox/**"
        do: script
        script: claims
      # Wake a session for my new work (taken or assigned). A session drains
      # the whole queue, so a wake dropped as busy is covered by the session
      # already running, or by `lease` below.
      - name: wake
        on: learn
        match: "inbox/{agent}/working/**"
        do: run
        recipe: work-task
      # The safety net: a copy still here when its lease runs out (a wake
      # that was dropped, a session that died) wakes a session again. A due
      # fire dropped as busy is retried at every sweep. Never a retract: the
      # copy stays until a session acknowledges it.
      - name: lease
        on: due
        match: "inbox/{agent}/**"
        do: run
        recipe: work-task

  acks:
    description: Completion notices, acks/<task-id>/. Refs point at the results in the knowledge base.
    attributes:
      learn_dedup: off
    validations:
      - name: signal
        message: an ack is a signal
        rule: "fact.type === 'signal'"

  # --- Pattern 2: host-awarded, exactly once (README "Two ways to take") ---
  offers:
    description: Work one instance awards, offers/<awarder-agent-id>/<lane>/. Normally the awarder is the hosting instance. One entity, the task id.
    attributes:
      learn_dedup: off
    validations:
      - name: signal
        message: an offer is a signal
        rule: "fact.type === 'signal'"
      - name: one-id
        message: an offer carries exactly one entity, its task id
        rule: "fact.entities.length === 1"
      - name: expires
        message: an offer must carry expires
        rule: "typeof fact.expires === 'string' && fact.expires !== ''"
    triggers:
      - name: expire-offer
        on: due
        match: "offers/**"
        do: script
        js: "knomit.retract(change.path)"
      - name: bid
        on: learn
        match: "offers/**"
        do: script
        script: awards

  bids:
    description: Requests for an offer, bids/<awarder-agent-id>/<task-id>/<bidder-agent-id>/.
    attributes:
      learn_dedup: off
    validations:
      - name: signal
        message: a bid is a signal
        rule: "fact.type === 'signal'"
    triggers:
      # Runs on the awarder only: {agent} is this instance.
      - name: award
        on: learn
        match: "bids/{agent}/**"
        do: script
        script: awards
      # A bid nobody awarded: its owner withdraws it when it expires.
      - name: withdraw-bid
        on: due
        match: "bids/*/*/{agent}/**"
        do: script
        js: |
          try {
            knomit.retract(change.path);
          } catch (e) {
            knomit.emit({withdrawn: change.path, error: String(e)});
          }

  awards:
    description: The awarder's decision, awards/<winner-agent-id>/. Written by the awarder only, once per offer.
    attributes:
      learn_dedup: off
    validations:
      - name: signal
        message: an award is a signal
        rule: "fact.type === 'signal'"
    triggers:
      - name: take-award
        on: learn
        match: "awards/{agent}/**"
        do: script
        script: awards

  # --- Annotations: facts ABOUT the target knowledge base's facts (README
  # "Annotations") ---
  # annotations/<task id>/: one folder per task, so parallel tasks never write
  # one file. An annotation's refs name the KB fact it is about as
  # kb://<kb repo id>/<path>; its `context` says what kind of annotation it is.
  # A cross-check writes one per fact it checks (kind: verdict); the fold reads
  # them and is the only writer of the KB's hypotheses.
  #
  # learn_dedup: off. Annotations on one fact look alike by design; with dedup
  # on, knomit_learn would merge one into another.
  annotations:
    description: Facts about facts in the target knowledge base, annotations/<task-id>/. Refs name the KB fact; context.kind says what the annotation is.
    attributes:
      learn_dedup: off
    context:
      kind:       {type: enum, values: [verdict], required: true}
      verdict:    {type: enum, values: [corroborate, contradict]}
      confidence: {type: number, min: 0, max: 1}
