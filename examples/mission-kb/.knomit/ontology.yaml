# A mission's knowledge base: where the agents' results go. It is the
# companion of examples/mission/ (the mission repo, which holds only
# signals). Read examples/mission/README.md, "The knowledge base", before
# editing.
#
# A repo's ontology is read when knomit opens the repo, and is never edited
# afterwards: create the knowledge base FROM a repository that already holds
# this file. Rename the lane topic first, and add one topic per lane.
id: mission-kb
name: Mission knowledge base
description: What a mission's agents learned. Dated evidence per lane, falsifiable hypotheses, cross-check verdicts and syntheses.

# The same settings as the mission repo, for the same reasons (README "Set it
# once and forget"): every agent writes here, so its commits travel at once.
attributes:
  consensus: auto
  conflicts:
    facts: merge
    state: consensus
  sync:
    push: realtime
    pull: realtime

# There is deliberately NO `on: due` retract on any topic here: a hypothesis's
# `expires` is its settlement date, and nobody retracts a hypothesis because
# it settled. People decide that.
topics:
  # One topic per lane of the mission (the gathering work). Rename this one and
  # add the others before the repo is created; the charter names the lanes.
  findings:
    description: Evidence gathered by one lane. Rename per lane; add one topic per lane.

  # Hypotheses, in the format every task that asks for predictions carries in
  # its body (the post-task skill's hypothesis-format block):
  #   forecast/<subject>/<granularity>/   granularity: year | month | day
  #   body lines: predicted: <period>, settles_true_if: <instrument>,
  #               settles_false_if: <instrument>  (+ counters: <path>)
  #   expires: the last second of the predicted period, 23:59:59Z
  # The validations refuse a hypothesis that breaks it, by rule name, on
  # knomit_learn and on knomit_update.
  #
  # learn_dedup: off. Two agents' hypotheses on one subject are near-identical
  # by design, and a counter-hypothesis is near-identical to what it counters.
  # With dedup on, knomit_learn would merge one into the other: a session's
  # experiment would then edit ANOTHER agent's hypothesis (the shared-fact
  # write that refused the first mission's parallel cross-checks), or swallow
  # the counter. Off, every hypothesis lands at its own path. knomit_review
  # still reads them (learn_dedup governs knomit_learn only).
  forecast:
    description: Falsifiable hypotheses, forecast/<subject>/<granularity>/. Hypotheses only, in the hypothesis format.
    attributes:
      learn_dedup: off
    validations:
      - name: hypothesis-only
        message: "the forecast topic holds hypotheses only (type hypothesis); a definition goes to meta, a synthesis to syntheses"
        rule: "fact.type === 'hypothesis'"
      - name: predicted
        message: "a hypothesis body needs a line 'predicted: <YYYY | YYYY-MM | YYYY-MM-DD>' (unindented, no bullet), naming a real period"
        rule: |
          (function () {
            var m = /^predicted:[ \t]*(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?(?=\s|$)/m.exec(fact.body);
            if (!m) return false;
            var y = +m[1], mo = m[2] ? +m[2] : 1, d = m[3] ? +m[3] : 1;
            var t = new Date(Date.UTC(y, mo - 1, d));
            return mo >= 1 && mo <= 12 && t.getUTCFullYear() === y &&
              t.getUTCMonth() === mo - 1 && t.getUTCDate() === d;
          })()
      - name: settles-true-if
        message: "a hypothesis body needs a line 'settles_true_if: <an instrument that already exists and can be observed>'"
        rule: "/^settles_true_if:[ \\t]*\\S/m.test(fact.body)"
      - name: settles-false-if
        message: "a hypothesis body needs a line 'settles_false_if: <an instrument that already exists and can be observed>'"
        rule: "/^settles_false_if:[ \\t]*\\S/m.test(fact.body)"
      - name: expires-ends-period
        message: "expires must be the last second of the predicted period in UTC: YYYY-12-31T23:59:59Z for a year, the month's last day at 23:59:59Z, or the day at 23:59:59Z"
        rule: |
          (function () {
            var m = /^predicted:[ \t]*(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?(?=\s|$)/m.exec(fact.body);
            if (!m || typeof fact.expires !== 'string' || fact.expires === '') return false;
            var at = Date.parse(fact.expires);
            if (isNaN(at)) return false;
            var y = +m[1];
            var end = m[3] ? Date.UTC(y, +m[2] - 1, +m[3], 23, 59, 59)
              : m[2] ? Date.UTC(y, +m[2], 0, 23, 59, 59)
              : Date.UTC(y, 11, 31, 23, 59, 59);
            return at === end;
          })()
      - name: granularity-in-path
        message: "file a hypothesis under forecast/<subject>/<granularity>/, where the granularity (year, month or day) is the one its 'predicted:' period has"
        rule: |
          (function () {
            var m = /^predicted:[ \t]*\d{4}(-\d{2})?(-\d{2})?(?=\s|$)/m.exec(fact.body);
            if (!m) return false;
            var g = m[2] ? 'day' : m[1] ? 'month' : 'year';
            var seg = String(fact.path).split('/');
            return seg.length >= 3 && seg[seg.length - 2] === g;
          })()

  # Cross-check verdicts, verdicts/<cross-check task id>/. A cross-check never
  # updates the facts it checks: it writes one NEW verdict fact per fact
  # checked (the post-task skill's verdict-format block), and ONE later fold
  # task, the only writer, folds them into the hypotheses. Parallel
  # cross-checks therefore never touch one file.
  #
  # learn_dedup: off. Verdicts on one target are near-identical by design;
  # with dedup on they would merge into each other, across tasks and agents.
  verdicts:
    description: Cross-check verdicts, verdicts/<cross-check task id>/. One new fact per fact checked; folded by one later task.
    attributes:
      learn_dedup: off
    validations:
      - name: verdict
        message: "a verdict body needs a line 'verdict: corroborate' or 'verdict: contradict' (unindented, no bullet)"
        rule: "/^verdict:[ \\t]*(corroborate|contradict)[ \\t]*$/m.test(fact.body)"
      - name: target
        message: "a verdict body needs a line 'target: <the path of the fact checked>'"
        rule: "/^target:[ \\t]*\\S+\\.md[ \\t]*$/m.test(fact.body)"
      - name: suggested-confidence
        message: "a verdict body needs a line 'suggested_confidence: <a number from 0 to 1>'"
        rule: "/^suggested_confidence:[ \\t]*(0(\\.\\d+)?|1(\\.0+)?|\\.\\d+)[ \\t]*$/m.test(fact.body)"
      - name: refs-target
        message: "a verdict's refs must include its target (and the evidence)"
        rule: |
          (function () {
            var m = /^target:[ \t]*(\S+\.md)[ \t]*$/m.exec(fact.body);
            if (!m) return false;
            var t = m[1];
            return fact.refs.some(function (r) {
              return r === t || r.slice(-(t.length + 1)) === '/' + t;
            });
          })()

  syntheses:
    description: Syntheses across lanes, written by sessions (knomit_review distills them).

  meta:
    description: Definitions, conventions and reasoning notes (knomit_hypothesize records its methodology under meta/reasoning).
