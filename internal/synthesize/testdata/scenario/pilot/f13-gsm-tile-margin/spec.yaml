description: >-
  Corsewick Ceramics, an invented floor-tile maker. q1 (F13, answer): why its
  operating margin fell in the second half of 2041. The first gather shows
  three lines: the synthesis c10 (clay cost; highest ranked, three refs), the
  Eddisford freight distractor c11, and the Lunsey kiln-gas tariff
  observation c05. c10 rests on the Ulvane kaolin contract-price observation
  c01, which is retracted (dead-end cause i, depth 2). ASSESS on the clay
  line is "not" (s3 backtrack); backtrack_choice s4 goes down the second menu
  line on the energy axis (domain energy / refs) to c06 and c07. The margin
  figure c03 is common to both lines and stays support. q2 (gap): how much
  of the drop came from clay. Line 1 dies on the retracted c01; line 2 is
  the hypothesis c12 (a predicted contract price, no support mass) and the
  undisclosed-terms filing c13 that gives no number. The gap names both.
ontology: |
  # Synthetic ontology for scenario worlds: a general-knowledge base shaped like
  # a reader's notebook on natural science, applied engineering and markets.
  # Shape only; worlds fill it with invented species, materials, firms, places
  # and numbers. No triggers.
  #
  # `principles` here is deliberately an ordinary topic with no kind/type rule:
  # it holds epistemic and pragmatic facts alike, so a world can show that the
  # folder confers no standing (the a-priori definition is the TYPE principle).
  #
  # Context: answer-fact keys (question / reason_run / trust_policy) are declared
  # on every topic, because there is no root-level context block.
  id: general-sciences-markets
  name: Sciences and Markets
  description: >-
    General knowledge about the natural world, applied engineering, and the
    markets that trade what both produce: measurements, mechanisms, models,
    prices and the reasoning that connects them.
  validations:
    - name: domain-non-empty
      message: every fact names at least one domain
      rule: "fact.domain.length > 0"
    - name: no-signals
      message: coordination signals do not belong in a knowledge base
      rule: "fact.type !== 'signal'"
  topics:
    science:
      description: Natural and applied science — organisms, materials, processes, measurements
      validations:
        - name: measurement-cites-source
          message: an observation or reference in science cites where it was measured (at least one ref)
          rule: "(fact.type !== 'observation' && fact.type !== 'reference') || fact.refs.length > 0"
        - name: reference-carries-value
          message: a reference fact states a value (its body contains a digit)
          rule: "fact.type !== 'reference' || /[0-9]/.test(fact.body)"
      context:
        measured_at:  {type: time}
        question:     {type: string, pattern: "^q-[a-z0-9-]{1,40}$"}
        reason_run:   {type: string, pattern: "^reason-[0-9a-f]{8}$"}
        trust_policy: {type: string, max_len: 64}
      children:
        biology:
          description: Organisms, populations, ecosystems
        chemistry:
          description: Compounds, reactions, materials
        earth:
          description: Climate, soils, water, geology
        engineering:
          description: Applied science — devices, processes, tolerances
    markets:
      description: Firms, products, prices, trade and the forces that move them
      validations:
        - name: market-fact-names-party
          message: a market observation names at least one party (firm, exchange, regulator, product)
          rule: "fact.type !== 'observation' || fact.entities.length > 0"
      context:
        as_of:        {type: time}
        currency:     {type: string, pattern: "^[A-Z]{3}$"}
        question:     {type: string, pattern: "^q-[a-z0-9-]{1,40}$"}
        reason_run:   {type: string, pattern: "^reason-[0-9a-f]{8}$"}
        trust_policy: {type: string, max_len: 64}
      children:
        firms:
          description: Companies, their products and results
        commodities:
          description: Raw materials and their prices
        trade:
          description: Flows between regions, tariffs, logistics
        regulation:
          description: Rules that bind market participants
    society:
      description: Institutions, policy, places and people as they bear on the above
      context:
        question:     {type: string, pattern: "^q-[a-z0-9-]{1,40}$"}
        reason_run:   {type: string, pattern: "^reason-[0-9a-f]{8}$"}
        trust_policy: {type: string, max_len: 64}
      children:
        institutions:
          description: Agencies, universities, standards bodies
        places:
          description: Regions, cities, sites
    principles:
      description: General laws, definitions and rules of thumb the notebook relies on — any kind, any type
      context:
        question:     {type: string, pattern: "^q-[a-z0-9-]{1,40}$"}
        reason_run:   {type: string, pattern: "^reason-[0-9a-f]{8}$"}
        trust_policy: {type: string, max_len: 64}
    meta:
      description: Knowledge about this knowledge base
      context:
        question:     {type: string, pattern: "^q-[a-z0-9-]{1,40}$"}
        reason_run:   {type: string, pattern: "^reason-[0-9a-f]{8}$"}
        trust_policy: {type: string, max_len: 64}
      children:
        reasoning:
          description: Methodology — how to weigh sources, models and forecasts here
        sources:
          description: Notes on the reliability of the sources this notebook cites
