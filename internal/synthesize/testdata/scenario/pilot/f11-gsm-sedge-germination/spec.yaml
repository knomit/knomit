  - id: m01
    topic: meta
    category: reasoning
    type: methodology
    title: Do not carry a cold-germination penalty between sedge populations from different water chemistry
    body: >-
      How much cold lowers germination depends on the depth of dormancy,
      which differs between populations, and brackish and acid-peat
      populations of one sedge can differ widely. Carry a penalty measured
      on one population only to lots from water of similar salinity and pH.
    confidence: 0.75
    sources: 1
    domain: [reasoning, seed-testing]
    entities: [cold-germination penalty]
    role: methodology
