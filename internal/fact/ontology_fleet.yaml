id: fleet
name: Fleet
description: >-
  A knomit fleet's source of truth. One member record per agent under
  members/, holding the agent's CURRENT state and key; earlier keys and
  states are earlier versions of the same fact (knomit explain). Records are
  never deleted: leaving or revoking is a state change. An instance joins by
  writing its own record on its agent branch; a human accepts by merging it
  into main.
# Every commit that enters main is judged against the member records and,
# once the fleet has a root certificate, the fleet's certificates.
attributes:
  verify_signatures: enforce
# The fleet's certificate artifacts, under artifacts/ (R7). The commit judge
# enforces these rules on every commit; the fleet reader finds the
# certificates through the pki declarations. Each issuance (the issued leaf)
# and each revocation (a root-signed statement) is a file of its own, written
# once; a file name is for uniqueness only and means nothing. The root is
# added only while it is missing: commit root.crt and crl.pem FIRST, when the
# fleet repository is created, and add members only afterwards. The CRL
# grows with every revocation and never shrinks, so it has no max_size.
artifacts:
  fleet/root.crt: { pki: root, change: write-once, max_size: 16KiB }
  fleet/crl.pem: { pki: crl, change: replace, replace_when: crl-newer, revoked_set: superset }
  fleet/certs/*.pem: { pki: leaf, change: replace, replace_when: leaf-renewal, max_size: 16KiB }
  fleet/issued/*.pem: { pki: issuance, change: write-once, max_size: 16KiB }
  fleet/revocations/*.txt: { pki: revocation, change: write-once, max_size: 4KiB }
topics:
  members:
    description: >-
      One record per agent (category = the agent id): agent, state
      (active | left | revoked), key (the current ssh-ed25519 key line),
      host, branch, then free text.
    validations:
      - name: members-are-policy
        message: a member record is a pragmatic policy fact
        rule: "fact.kind === 'pragmatic' && fact.type === 'policy'"
