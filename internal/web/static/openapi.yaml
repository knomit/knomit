  # ---------------------------------------------------------------------------
  # Lenses
  # ---------------------------------------------------------------------------
  /lenses:
    get:
      tags: [lenses]
      summary: List lenses
      operationId: listLenses
      responses:
        "200":
          description: Collection of lenses
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/LensesCollection" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    post:
      tags: [lenses]
      summary: Create a lens
      description: |
        Members are identified by registry uid (`GET /repos`) and by nothing
        else — a uid no repo has, a read mount with no `uid`, or a bare
        repo-name string is a 400.

        The rest of validation runs in the manager: name grammar, collision
        with an existing repo or lens name, replica mounts (two mounts sharing
        one repo ID are rejected), unknown member repos, unknown pinned
        branches, and the description length cap.
      operationId: createLens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LensCreateRequest" }
      responses:
        "201":
          description: Lens created
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Lens" }
        "400":
          description: |
            Invalid body, invalid lens name, empty write repo, a member that is
            not identified by a registered repo uid, or a member whose uid names
            an archived repo.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            Name already taken by a lens or repo, a create is already in
            flight, or two mounts resolve to the same repo (replica).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |
            Unknown pinned branch, description too long, or a member repo that
            passed the uid check and then went away (archived) before the
            manager validated it.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /lenses/{lens}:
    parameters:
      - $ref: "#/components/parameters/Lens"
    get:
      tags: [lenses]
      summary: Get a lens
      operationId: getLens
      responses:
        "200":
          description: Lens
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Lens" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [lenses]
      summary: Edit a lens
      description: |
        Edits the write repo, read mounts, and description. The name is
        immutable and has no field in the body. An omitted field keeps its
        current value; a provided field replaces it wholesale — `reads`
        replaces as a set, it never merges. The merged lens is re-validated
        with the full create-time rule set.
      operationId: patchLens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LensPatchRequest" }
      responses:
        "200":
          description: Updated lens
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Lens" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [lenses]
      summary: Delete a lens
      description: Deletes the lens definition only; member repos are untouched.
      operationId: deleteLens
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /lenses/{lens}/rename:
    parameters:
      - $ref: "#/components/parameters/Lens"
    post:
      tags: [lenses]
      summary: Rename a lens
      description: |
        A custom action rather than PATCH /lenses/{lens}, for the same reason
        as the repo rename route: the response re-reads the lens through the
        NEW name, and a rename invalidates the very identifier the request
        was addressed by. Renaming to the current name is a successful
        no-op. 409 covers the new name being held by another lens or by a
        repo — repos and lenses share one namespace. Unlike the repo route,
        an unknown `{lens}` is a plain 404: GET/PATCH/DELETE/rename on
        `/lenses/{lens}` resolve the name directly rather than through
        middleware, so this handler is the first (and only) lookup.
      operationId: renameLens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameRequest" }
      responses:
        "200":
          description: Lens renamed; response addresses it by the new name
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Lens" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /lenses/{lens}/facts:
    parameters:
      - $ref: "#/components/parameters/Lens"
    get:
      tags: [lenses, facts]
      summary: Union facts collection across the lens's mounts
      description: |
        Fans out to every selected mount at its pinned branch, dedupes by
        repo-relative path (the write mount's copy wins), and orders the union:
        by `committed_at` descending without a text query, by reciprocal-rank
        fusion with one. `total` is the post-dedupe union size and
        `limit`/`offset` page WITHIN it. Each mount contributes at most 500
        candidate rows to the merged set.

        Any mount error fails the whole request — a lens never silently shrinks
        its read set.
      operationId: listLensFacts
      parameters:
        - { name: limit,          in: query, description: "1–500; out-of-range or non-integer is 400.", schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: offset,         in: query, description: "Non-negative; negative or non-integer is 400.", schema: { type: integer, default: 0, minimum: 0 } }
        - { name: query,          in: query, description: "Text filter. `q` is accepted as an alias for parity with the repo collection.", schema: { type: string } }
        - { name: q,              in: query, description: "Alias for `query`, used only when `query` is absent.", schema: { type: string } }
        - $ref: "#/components/parameters/LensPathFilter"
        - { name: topic,          in: query, description: "Ontology-root subdirectory shorthand: `topic=invariants` → `path=kb/invariants/`. An explicit `path=` always wins.", schema: { type: string } }
        - $ref: "#/components/parameters/LensRepoNarrow"
        - { name: domain,         in: query, description: CSV, schema: { type: string } }
        - { name: domain_exact,   in: query, schema: { type: boolean, default: false } }
        - { name: entity,         in: query, description: "CSV. Canonical name; merges with the `entities` alias.", schema: { type: string } }
        - { name: entities,       in: query, description: "CSV. Back-compat alias for `entity`; values merge.", schema: { type: string } }
        - { name: type,           in: query, description: CSV, schema: { type: string } }
        - { name: exclude_type,   in: query, description: CSV, schema: { type: string } }
        - { name: kind,           in: query, description: CSV, schema: { type: string } }
        - { name: exclude_kind,   in: query, description: CSV, schema: { type: string } }
        - { name: origin,         in: query, description: CSV, schema: { type: string } }
        - { name: ep,             in: query, description: CSV (episode operations), schema: { type: string } }
        - { name: min_confidence, in: query, description: "Non-numeric is 400.", schema: { type: number, format: double } }
        - { name: min_similarity, in: query, description: "Non-numeric is 400.", schema: { type: number, format: double } }
      responses:
        "200":
          description: Deduped union of facts
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/LensFactsResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422":
          description: "`repo=` names a mount that is not in this lens"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /lenses/{lens}/facts/{path}:
    parameters:
      - $ref: "#/components/parameters/Lens"
      - $ref: "#/components/parameters/LensFactPath"
    get:
      tags: [lenses, facts]
      summary: Read a single fact through a lens
      description: |
        The repo single-fact body verbatim, plus a `source` block naming the
        mount it came from. `_links` stay repo-scoped (they point at the owning
        mount's own endpoints); the top-level `path` echoes the canonical lens
        wire address so it can be round-tripped into another lens request.

        Addressing: a bare `kb/…` path always reads from the WRITE repo — there
        is no dedupe scan, even when a read mount shadows the same
        repo-relative path. A `kb://<id12>/kb/…` path reads from that mount.

        Every not-found case — unknown mount id, malformed `kb://` path,
        missing or retracted fact — returns a byte-identical 404, so a caller
        cannot probe the lens's mount topology.
      operationId: getLensFact
      responses:
        "200":
          description: Fact with its source mount
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/LensFact" }
        "400":
          description: Empty fact path
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /lenses/{lens}/search:
    parameters:
      - $ref: "#/components/parameters/Lens"
    get:
      tags: [lenses, search]
      summary: Union relevance search across the lens's mounts
      description: |
        Fans out to every selected mount, then orders the union by
        reciprocal-rank fusion over each mount's rank — not over native scores,
        which are not comparable across mounts. After fusion, rows are deduped
        by repo-relative path with the write mount's copy winning, even when a
        shadowed copy ranks higher. Read-mount paths are qualified as
        `kb://<id12>/…`.
      operationId: searchLens
      parameters:
        - { name: q,              in: query, schema: { type: string } }
        - { name: limit,          in: query, description: "1–500; out-of-range or non-integer is 400.", schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - $ref: "#/components/parameters/LensPathFilter"
        - $ref: "#/components/parameters/LensRepoNarrow"
        - { name: entities,       in: query, description: CSV, schema: { type: string } }
        - { name: domain,         in: query, description: CSV, schema: { type: string } }
        - { name: domain_exact,   in: query, schema: { type: boolean, default: false } }
        - { name: type,           in: query, description: CSV, schema: { type: string } }
        - { name: exclude_type,   in: query, description: CSV, schema: { type: string } }
        - { name: kind,           in: query, description: CSV, schema: { type: string } }
        - { name: exclude_kind,   in: query, description: CSV, schema: { type: string } }
        - { name: origin,         in: query, description: CSV, schema: { type: string } }
        - { name: ep,             in: query, description: CSV (episode operations), schema: { type: string } }
        - { name: min_confidence, in: query, description: "Non-numeric is 400.", schema: { type: number, format: double } }
        - { name: min_similarity, in: query, description: "Non-numeric is 400.", schema: { type: number, format: double } }
      responses:
        "200":
          description: Fused union of search results
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/LensSearchResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422":
          description: "`repo=` names a mount that is not in this lens"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /lenses/{lens}/completions:
    parameters:
      - $ref: "#/components/parameters/Lens"
    get:
      tags: [lenses, search]
      summary: Union autocomplete suggestions across the lens's mounts
      description: |
        Unions each mount's values (first-seen order preserved, deduped across
        mounts). Completions are not path-scoped, so the fan-out covers every
        mount and takes no `path`/`repo` filter.

        `category=repo` is lens-only and is served from the lens definition
        alone: the mount NAMES in binding order (write repo first), filtered
        case-insensitively by `prefix`.
      operationId: getLensCompletions
      parameters:
        - { name: category, in: query, description: "Same categories as the repo endpoint, plus the lens-only `repo`.", schema: { type: string } }
        - { name: prefix,   in: query, schema: { type: string } }
      responses:
        "200":
          description: Union of completion values
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/LensCompletions" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /lenses/{lens}/stats:
    parameters:
      - $ref: "#/components/parameters/Lens"
    get:
      tags: [lenses, stats]
      summary: Union statistics across the lens's mounts
      description: |
        Returns the lens-wide roll-up plus a per-mount breakdown.
        `avg_confidence` is the count-weighted mean across mounts; `domains`
        and `entities` are summed. Empty maps serialize as `{}`, never `null`.
      operationId: getLensStats
      parameters:
        - $ref: "#/components/parameters/LensPathFilter"
        - $ref: "#/components/parameters/LensRepoNarrow"
        - $ref: "#/components/parameters/RankAxis"
      responses:
        "200":
          description: Union statistics
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/LensStats" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422":
          description: "`repo=` names a mount that is not in this lens"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /lenses/{lens}/topics:
    parameters:
      - $ref: "#/components/parameters/Lens"
    get:
      tags: [lenses, topics]
      summary: Browse the merged ontology tree through a lens (root)
      description: |
        ONE level of the ontology tree, merged by topic across the lens's
        mounts — lazy per level, like the repo browse. Directory names are
        deduped by shared topic vocabulary (first-seen wins); leaf entries are
        deduped with the write mount winning and carry their `source` mount.

        Assumes every mount shares the server's global ontology root.
      operationId: listLensTopics
      parameters:
        - $ref: "#/components/parameters/LensRepoNarrow"
      responses:
        "200":
          description: One merged level of the ontology tree
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/LensTopics" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422":
          description: "`repo=` names a mount that is not in this lens"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /lenses/{lens}/topics/{path}:
    parameters:
      - $ref: "#/components/parameters/Lens"
      - { name: path, in: path, required: true, description: "Topic node path under the ontology root (may contain slashes).", schema: { type: string } }
    get:
      tags: [lenses, topics]
      summary: Merged ontology node through a lens
      description: |
        Same merge as the root browse, one level below the given node. From
        `kb/<topic>/…` onward, mounts whose ontology lacks the topic are
        skipped rather than queried.
      operationId: getLensTopic
      parameters:
        - $ref: "#/components/parameters/LensRepoNarrow"
      responses:
        "200":
          description: One merged level of the ontology tree
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/LensTopics" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422":
          description: "`repo=` names a mount that is not in this lens"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /lenses/{lens}/mcp:
    parameters:
      - $ref: "#/components/parameters/Lens"
    get: &lensMcp
      tags: [lenses, mcp]
      summary: MCP server proxy, lens-scoped
      description: |
        Dispatches to the configured MCP handler with the lens binding in
        scope, so its tools read the union rather than a single repo. Accepts
        any HTTP method; request/response shape is defined by the Model Context
        Protocol.
      operationId: lensMcpDispatch
      responses:
        "200": { description: MCP response (shape varies) }
        "404": { $ref: "#/components/responses/Problem" }
    post: *lensMcp
    put: *lensMcp
    delete: *lensMcp

  /lenses/{lens}/mcp/{path}:
    parameters:
      - $ref: "#/components/parameters/Lens"
      - { name: path, in: path, required: true, schema: { type: string } }
    get: &lensMcpSub
      tags: [lenses, mcp]
      summary: MCP server proxy, lens-scoped (sub-path)
      operationId: lensMcpDispatchSub
      responses:
        "200": { description: MCP response (shape varies) }
        "404": { $ref: "#/components/responses/Problem" }
    post: *lensMcpSub
    put: *lensMcpSub
    delete: *lensMcpSub

components:
  parameters:
    Repo:
      name: repo
      in: path
      required: true
      description: |
        Repository name. Routes MOUNTED UNDER the repo middleware resolve it
        once there and share two failure modes: 404 when no repo is registered
        under the name, and 409 when one IS registered but has no live store
        (see `RepoSummary.state`). The 409 `detail` names the reason.

        Not every route carrying this parameter is one of them. `DELETE
        /repos/{repo}` (archive) sits OUTSIDE the middleware, so it never
        answers the middleware's 409 — but that does NOT make it usable on a
        repo with no live store: archiving resolves the name through the live
        repo map, which an unavailable repo is not in, so it answers 404 there
        exactly as an unregistered name does. The 409 that operation DOES
        document means something else entirely (the name is contested). Each
        operation's own responses are authoritative.
      schema: { type: string }
    Branch:     { name: branch,    in: path, required: true, schema: { type: string } }
    Sha:        { name: sha,       in: path, required: true, schema: { type: string } }
    JobID:      { name: id,        in: path, required: true, schema: { type: string } }
    SessionID:  { name: sessionID, in: path, required: true, schema: { type: string } }
    ArchivedID: { name: id,        in: path, required: true, schema: { type: string }, description: "The repo's registry uid, as returned in `ArchivedRepo.id`." }
    Lens:       { name: lens,      in: path, required: true, schema: { type: string } }
    FactPath:
      name: path
      in: path
      required: true
      description: Fact path under the ontology root (may contain slashes).
      schema: { type: string }
    LensFactPath:
      name: path
      in: path
      required: true
      description: |
        Either a bare `kb/…` path (reads from the lens's write repo) or a
        mount-qualified `kb://<id12>/kb/…` path. Qualified paths must be
        percent-encoded by the client.
      schema: { type: string }
    LensRepoNarrow:
      name: repo
      in: query
      description: |
        Repeatable. Narrows the fan-out to the named mounts. A name that is not
        a mount of this lens is a 422.
      schema: { type: array, items: { type: string } }
      style: form
      explode: true
    LensPathFilter:
      name: path
      in: query
      description: |
        Path prefix filter. A bare path applies per mount, skipping mounts
        whose ontology lacks the topic; a `kb://<id12>/…` path restricts the
        fan-out to that single mount, with the filter made repo-relative.
      schema: { type: string }

    RankAxis:
      name: axis
      in: query
      required: false
      schema: { type: string, enum: [impact, confidence, recent] }
      description: |
        Ranking for `highlights`. Omitted → the server ranks by its own
        `default_axis`. Ranking is always over the full eligible set, so the
        returned rows are the true top-10 for the requested axis.
        Unrecognised values fall back to `default_axis`.

    PathFilter:
      name: path
      in: query
      required: false
      schema: { type: string }
      description: |
        Path prefix filter under the ontology root. Scopes `total`,
        `avg_confidence`, `domains`, `entities`, `types` and `highlights`.
        Does NOT affect a highlight's `impact` (global out-degree) or
        `default_axis` (repo-scoped).

  responses:
    Problem:
      description: RFC 9457 problem+json
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # HAL primitives
    Link:
      type: object
      required: [href]
      properties:
        href:      { type: string }
        templated: { type: boolean }

    LinkMap:
      type: object
      additionalProperties: { $ref: "#/components/schemas/Link" }

    CollectionBase:
      type: object
      required: [count, _links]
      properties:
        count:     { type: integer }
        _links:    { $ref: "#/components/schemas/LinkMap" }
        _embedded: { type: object }

    Problem:
      type: object
      required: [title, status]
      properties:
        type:     { type: string, default: "about:blank" }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }

    # Discovery / repos / branches
    Root:
      type: object
      required: [_links]
      properties:
        _links: { $ref: "#/components/schemas/LinkMap" }

    Version:
      type: object
      required: [version, commit, full, _links]
      properties:
        version: { type: string, description: "Major.Minor.Patch semver", example: "0.5.0" }
        commit: { type: string, description: "Short git SHA of the build", example: "2a7ae9d" }
        full: { type: string, description: "Combined version string", example: "0.5.0.2a7ae9d" }
        _links: { $ref: "#/components/schemas/LinkMap" }

    RepoSummary:
      type: object
      required: [name, uid, id, state, _links]
      properties:
        name:   { type: string }
        uid:    { type: string, description: "Registry uid — the identifier lens membership is keyed by. Distinct from `id`: it exists before the repo is opened and survives a store swap." }
        id:     { type: string, description: "Short repo ID. Empty for a repo with no live store — the root-commit identity is a property of a store that could not be read." }
        state:
          type: string
          description: |
            `active` when the repo has a live store. Otherwise the reason it has
            none: `missing` (the database file is gone), `unopenable` (the file
            is there but the store or git failed to open), or `conflict`
            (another active repo already holds this knowledge base).

            A repo in a non-active state is REGISTERED — it stays in this list,
            and its own endpoints answer 409, not 404. Treat an unrecognised
            value as "not active" rather than dropping the row.
          example: active
        detail:
          type: string
          description: Human-readable amplification of a non-active state. Omitted when the repo is active.
        _links: { $ref: "#/components/schemas/LinkMap" }

    ReposCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                repos:
                  type: array
                  items: { $ref: "#/components/schemas/RepoSummary" }

    Repo:
      type: object
      required: [name, uid, id, _links]
      properties:
        name:         { type: string }
        uid:          { type: string, description: "Registry uid — the identifier lens membership is keyed by." }
        id:           { type: string, description: Short repo ID }
        agent_branch: { type: string }
        description:
          type: string
          description: |
            Verbatim content of the repo's README.md root manifest, read at HEAD.
            Omitted when the repo has no readable README.md.
        license:
          type: string
          description: >
            Verbatim contents of LICENSE at the repository root, read at the
            agent-branch tip. Omitted when the repository has no LICENSE, or
            when one exists but exceeds 65536 bytes (see `license_oversize`
            below — that case is NOT "no LICENSE"). Editable via PATCH, with
            the same pointer semantics as `description`; PATCHing a license
            while `license_oversize` is true is refused with 409, since the
            request can only replace content it never actually read.
        license_oversize:
          type: boolean
          description: >
            True when a LICENSE exists at the repository root but exceeds the
            65536-byte read cap, so `license` is omitted rather than a
            truncated or partial read. Mutually exclusive with `license` being
            present, and omitted entirely (never sent as `false`) in every
            other case. Clients must render this distinctly from "no
            LICENSE" — a UI that offers to Add/Edit a LICENSE it never read
            risks a save that silently destroys the original.
        _links: { $ref: "#/components/schemas/LinkMap" }

    BranchSummary:
      type: object
      required: [name, _links]
      properties:
        name:   { type: string }
        _links: { $ref: "#/components/schemas/LinkMap" }

    BranchesCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                branches:
                  type: array
                  items: { $ref: "#/components/schemas/BranchSummary" }

    Branch:
      type: object
      required: [name, head, _links]
      properties:
        name:               { type: string }
        head:               { type: string, description: HEAD commit hash }
        index_commit:       { type: string }
        embeddings_enabled: { type: boolean }
        is_agent_branch:    { type: boolean }
        _links:             { $ref: "#/components/schemas/LinkMap" }

    # Facts
    FactAsOf:
      type: object
      properties:
        branch: { type: string }
        commit: { type: string }
        date:
          type: string
          format: date-time
          description: |
            RFC3339 commit date of the version of this fact visible at the
            anchor — the newest commit at or before `commit` that added or
            modified this path, NOT the anchor commit's own date. Optional:
            omitted entirely when it cannot be resolved (an unindexed or GC'd
            commit), so a client must treat absence as "unknown", never as
            the epoch.

    Fact:
      type: object
      required: [path, title, _links]
      properties:
        path:       { type: string }
        title:      { type: string }
        body:       { type: string }
        type:
          type: string
          enum: [observation, concept, process, principle, pattern, reference, synthesis, insight, hypothesis, methodology]
        domain:     { type: array, items: { type: string } }
        entities:   { type: array, items: { type: string } }
        refs:
          type: array
          items: { $ref: "#/components/schemas/RefView" }
        ref_warnings:
          type: array
          items: { type: string }
          description: >
            Refs whose syntax is malformed. Present only when the stored fact
            carries one: reading is deliberately lenient (a version that was
            legal when committed stays readable), so this is how such a
            citation surfaces instead of the fact disappearing from the index.
        confidence: { type: number, format: double }
        sources:   { type: integer }
        as_of:     { $ref: "#/components/schemas/FactAsOf" }
        _links:    { $ref: "#/components/schemas/LinkMap" }

    FactSummary:
      type: object
      required: [path, title, _links]
      properties:
        path:         { type: string }
        title:        { type: string }
        type:         { type: string }
        confidence:   { type: number, format: double }
        committed_at: { type: string, format: date-time }
        operation:    { type: string }
        _links:       { $ref: "#/components/schemas/LinkMap" }

    RefView:
      type: object
      required: [raw, kind]
      description: >
        One entry of a fact's refs array. `kind` is decided server-side from the
        ref's syntax and repo identity; for a fact in this repo it additionally
        reflects existence AT THE ANCHOR being viewed, which only the server can
        know. Clients must never re-derive any of this from `raw`.
      properties:
        raw:
          type: string
          description: The ref exactly as the author wrote it.
        path:
          type: string
          description: >
            Repo-relative fact path, present for kind `fact` and `broken` only.
            A canonical `kb://<own-id>/<path>` ref and its bare equivalent name
            the same fact and yield the same `path`; clients must use this
            rather than parsing `raw`.
        kind:
          type: string
          enum: [fact, broken, foreign, source_code, url]
          description: >
            fact — a fact in this repo, present at the anchor; the only kind
            carrying _links.target.
            broken — a fact in this repo, absent at the anchor.
            foreign — a fact in ANOTHER knomit repo (kb://<other-id>/…); not
            broken, merely not resolvable from here.
            source_code — a src:// citation; never resolves here, since knomit
            stores fact blobs and not source.
            url — http(s)://, file://, or any other scheme.
        _links: { $ref: "#/components/schemas/LinkMap" }

    Ref:
      type: object
      required: [path]
      properties:
        path:    { type: string }
        title:   { type: string }
        type:    { type: string }
        # commit pins each entry to a specific version: source_commit for
        # /incoming items (the commit that asserted the ref), target_commit
        # for /outgoing items (the version of the target the ref resolved to
        # at the source's commit). _links.self is anchored to this commit.
        commit:  { type: string, description: "Commit hash this entry is pinned to (source_commit on /incoming, target_commit on /outgoing)." }
        # Outgoing-only: target Fact node is soft-deleted at the anchor.
        # When true, _links.self is omitted (no navigable destination).
        deleted: { type: boolean }
        _links:  { $ref: "#/components/schemas/LinkMap" }

    FactsCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                facts:
                  type: array
                  items: { $ref: "#/components/schemas/FactSummary" }

    RefsCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                refs:
                  type: array
                  items: { $ref: "#/components/schemas/Ref" }

    FactCreateRequest:
      type: object
      required: [title]
      properties:
        title:      { type: string }
        body:       { type: string }
        type:       { type: string }
        domain:     { type: array, items: { type: string } }
        entities:   { type: array, items: { type: string } }
        refs:       { type: array, items: { type: string } }
        confidence: { type: number, format: double }
        sources:    { type: integer }

    FactUpdateRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: Full markdown document with YAML frontmatter.

    # Topics
    TopicNode:
      type: object
      required: [name, _links]
      properties:
        name:   { type: string }
        is_dir: { type: boolean }
        type:   { type: string }
        title:  { type: string }
        _links: { $ref: "#/components/schemas/LinkMap" }

    TopicsCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                topics:
                  type: array
                  items: { $ref: "#/components/schemas/TopicNode" }

    # Search
    SearchHit:
      allOf:
        - $ref: "#/components/schemas/FactSummary"
        - type: object
          properties:
            score:    { type: number, format: double }
            domain:   { type: array, items: { type: string } }
            entities: { type: array, items: { type: string } }

    SearchCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                results:
                  type: array
                  items: { $ref: "#/components/schemas/SearchHit" }

    # Stats / activity / completions / domains
    Activity:
      type: object
      required: [_links]
      properties:
        last_commit: { type: string, format: date-time }
        total:       { type: integer }
        changes_7d:  { type: integer }
        changes_30d: { type: integer }
        changes_90d: { type: integer }
        _links:      { $ref: "#/components/schemas/LinkMap" }

    Completions:
      type: object
      required: [values, _links]
      properties:
        values: { type: array, items: { type: string } }
        _links: { $ref: "#/components/schemas/LinkMap" }

    DomainEntry:
      type: object
      required: [name, count, _links]
      properties:
        name:   { type: string }
        count:  { type: integer }
        _links: { $ref: "#/components/schemas/LinkMap" }

    DomainsCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                domains:
                  type: array
                  items: { $ref: "#/components/schemas/DomainEntry" }

    Highlight:
      type: object
      required: [path, title, type, confidence, impact, committed_at]
      properties:
        path:        { type: string }
        title:       { type: string }
        type:        { type: string, description: Epistemic or pragmatic leaf type. Never `observation` or `reference`. }
        confidence:  { type: number, format: double }
        impact:      { type: integer, description: "Count of DISTINCT facts reached by outgoing DERIVED_FROM edges — how many facts this was derived from. Not an edge-row count (the same lineage can be asserted at more than one commit). Global: unaffected by the `path` filter." }
        committed_at: { type: integer, format: int64, description: Unix seconds. }

    Stats:
      type: object
      required: [total, _links]
      properties:
        total:          { type: integer }
        avg_confidence: { type: number, format: double }
        domains:
          type: object
          additionalProperties: { type: integer }
        entities:
          type: object
          additionalProperties: { type: integer }
        types:
          type: object
          additionalProperties: { type: integer }
          description: "Live fact counts per type, path-scoped. Includes observations. `{}` when empty, never null."
        highlights:
          type: array
          maxItems: 10
          description: "Top-10 facts ranked by `default_axis`. `[]` when empty, never null."
          items: { $ref: "#/components/schemas/Highlight" }
        default_axis:
          type: string
          enum: [impact, confidence]
          description: |
            Server's per-repo recommendation, from the ratio of mean
            DERIVED_FROM out-degree between the distilled layer and
            observations. Repo-scoped — unaffected by `path`.
        _links: { $ref: "#/components/schemas/LinkMap" }

    # Commits
    FileCounts:
      type: object
      properties:
        added:    { type: integer }
        modified: { type: integer }
        deleted:  { type: integer }

    CommitAuthor:
      type: object
      description: >
        The git author identity of the commit, recorded verbatim. For agent
        writes, name is the agent-id and email carries the +operation
        subaddress (e.g. agent-7+learn@agents.knomit.io). For PR merges into
        main, this is the human who merged (the committer would be GitHub).
      required: [name, email]
      properties:
        name:  { type: string }
        email: { type: string }

    CommitSummary:
      type: object
      required: [commit, date, author, _links]
      properties:
        commit:    { type: string }
        date:      { type: string, format: date-time }
        message:   { type: string }
        operation: { type: string }
        author:    { $ref: "#/components/schemas/CommitAuthor" }
        files:     { $ref: "#/components/schemas/FileCounts" }
        _links:    { $ref: "#/components/schemas/LinkMap" }

    CommitsCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                commits:
                  type: array
                  items: { $ref: "#/components/schemas/CommitSummary" }

    CommitFile:
      type: object
      required: [path, action]
      properties:
        path:   { type: string }
        action: { type: string, enum: [added, modified, deleted] }
        title:  { type: string }
        _links: { $ref: "#/components/schemas/LinkMap" }

    CommitDetail:
      type: object
      required: [commit, date, author, _links]
      properties:
        commit:    { type: string }
        date:      { type: string, format: date-time }
        message:   { type: string }
        operation: { type: string }
        author:    { $ref: "#/components/schemas/CommitAuthor" }
        files:
          type: array
          items: { $ref: "#/components/schemas/CommitFile" }
        _links: { $ref: "#/components/schemas/LinkMap" }

    # Jobs
    Job:
      type: object
      required: [id, kind, state, _links]
      properties:
        id:         { type: string }
        kind:       { type: string, enum: [synthesis-run, index-rebuild] }
        state:      { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        progress:   { type: number, format: double }
        error:      { type: string }
        _links:     { $ref: "#/components/schemas/LinkMap" }

    JobsCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                jobs:
                  type: array
                  items: { $ref: "#/components/schemas/Job" }

    # Repo lifecycle — create / archive / restore / purge
    CreateRepoOrigin:
      type: object
      description: Remote origin to clone from or seed (used when mode=clone or mode=seed).
      properties:
        url:         { type: string, description: Remote URL }
        branch:      { type: string, description: Remote branch to track }
        auth_method: { type: string, enum: [token, basic, ssh] }
        auth_token:  { type: string }

    CreateRepoRequest:
      type: object
      required: [name, mode]
      properties:
        name:
          type: string
          description: Unique repo name (slug).
        mode:
          type: string
          enum: [preset, custom, clone, seed]
          description: |
            preset — use a built-in ontology preset (e.g. default, code).
            custom — supply ontology_yaml directly.
            clone  — clone from a remote origin; ontology is taken from the remote.
            seed   — initialise an EMPTY remote origin with a chosen ontology
                     (ontology_preset or ontology_yaml), so local and remote
                     share a root commit from birth. Create re-asserts the
                     remote is still empty and fails with 409 if it is not —
                     use mode=clone instead to join a non-empty remote.
        ontology_preset:
          type: string
          description: "Preset identifier (e.g. default, code). Used when mode=preset or mode=seed."
        ontology_yaml:
          type: string
          description: Raw ontology YAML. Used when mode=custom or mode=seed.
        origin:
          $ref: "#/components/schemas/CreateRepoOrigin"

    CreateRepoEvent:
      type: object
      description: |
        One line of the NDJSON creation stream. Each object carries a `type`
        discriminator and optional progress fields. The stream always ends with
        a `done` or `error` event.
      required: [type]
      properties:
        type:
          type: string
          enum: [progress, done, error]
          description: Event kind.
        step:
          type: string
          description: Machine-readable step identifier (e.g. "init", "clone", "index").
        message:
          type: string
          description: Human-readable progress message.
        pct:
          type: number
          format: double
          description: Completion percentage (0–100), present on progress events.
        repo:
          type: string
          description: Repo name, present on the final done event.
        title:
          type: string
          description: Short summary, present on done/error events.
        detail:
          type: string
          description: Extended detail or error description.

    # Origin probe (pre-create)
    ProbeOriginRequest:
      type: object
      required: [url]
      description: |
        Same fields as CreateRepoOrigin, but url is required — there is
        nothing to probe without one.
      properties:
        url:         { type: string, description: Remote URL to probe. }
        branch:      { type: string, description: "Branch to report as upstream if already known; otherwise the probe derives it (see ProbeOriginResult.upstream_branch)." }
        auth_method: { type: string, enum: [token, basic, ssh] }
        auth_token:  { type: string }

    ProbeOriginResult:
      type: object
      required: [reachable, empty, auth_required, upstream_branch, branches]
      description: |
        What a pre-create look at a remote can establish via
        `remote.ListContext` — REFS ONLY. Deliberately carries no fact count,
        commit count, or ontology id: establishing those needs a real fetch.
        Advisory, not authority — a remote can gain refs between the probe
        and the create.
      properties:
        reachable:
          type: boolean
          description: |
            false only for a connection-level failure (timeout, DNS,
            connection refused, unknown host, ...). true whenever the remote
            answered at all, including when empty or auth_required.
        empty:
          type: boolean
          description: true when the remote has no branches.
        auth_required:
          type: boolean
          description: true when the remote demanded credentials the probe did not have.
        upstream_branch:
          type: string
          description: |
            The branch a clone would actually adopt: the requested branch if
            one was given, else "main" if the remote has it, else the
            remote's symbolic HEAD, else "main" as the last resort. Mirrors
            InitFromRemote's own preference order.
        branches:
          type: array
          items: { type: string }
          description: Every branch the remote reported. Empty when empty is true.
        detail:
          type: string
          description: Extra detail — an error message when unreachable or auth_required, otherwise absent.

    ArchivedRepo:
      type: object
      required: [id, name, archivedAt, sizeBytes, _links]
      properties:
        id:
          type: string
          description: The repo's registry uid — the same key restore and purge take.
        name:
          type: string
          description: Repo name at the time of archival.
        origin:
          type: string
          description: Remote origin URL, if configured.
        archivedAt:
          type: string
          format: date-time
          description: |
            Timestamp when the repo was archived. Stored at one-second
            resolution, so the listing breaks ties on `id` to keep its order
            total.
        sizeBytes:
          type: integer
          format: int64
          description: |
            On-disk size of the archived database. An archived repo's file never
            moves and is named for its uid, so this is the only place the disk a
            purge would reclaim is visible. 0 when the file could not be stat'd.
        _links: { $ref: "#/components/schemas/LinkMap" }

    ArchivedReposCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                archived:
                  type: array
                  items: { $ref: "#/components/schemas/ArchivedRepo" }

    RestoreRepoRequest:
      type: object
      properties:
        new_name:
          type: string
          description: Optional new name for the restored repo (defaults to original name).

    RenameRequest:
      type: object
      required: [name]
      description: Body for POST /repos/{repo}/rename and POST /lenses/{lens}/rename.
      properties:
        name:
          type: string
          description: The new name. Must match the shared repo/lens grammar `[a-z0-9_-]+`.

    # Origin
    # Mirrors originView in handlers_origin_hal.go exactly. The sync/push status
    # half is NOT optional decoration: it is the only place the UI can read real
    # last-sync state from, and a generated client that omits it cannot render
    # the remote card at all. Every field below is always present in the
    # response (the nullable ones as null), which is why they are all required.
    Origin:
      type: object
      required:
        [name, url, branch, interval, last_sync_at, last_status, last_error,
         push_interval, last_push_at, last_push_status, last_push_error, _links]
      properties:
        name:             { type: string }
        url:              { type: string }
        branch:           { type: string, description: "The upstream consensus branch this repo tracks." }
        interval:         { type: integer, description: "Fetch/reconcile interval in seconds." }
        last_sync_at:     { type: string, nullable: true, description: "RFC3339; null before the first sync." }
        last_status:      { type: string, nullable: true }
        last_error:       { type: string, nullable: true }
        push_interval:    { type: integer, description: "Push interval in seconds." }
        last_push_at:     { type: string, nullable: true }
        last_push_status: { type: string, nullable: true }
        last_push_error:  { type: string, nullable: true }
        auth_method:      { type: string, enum: [token, basic, ssh] }
        _links:           { $ref: "#/components/schemas/LinkMap" }

    OriginConfigRequest:
      type: object
      required: [url]
      properties:
        url:         { type: string }
        branch:      { type: string, description: "Upstream consensus branch. Defaults to the stored branch, then \"main\"." }
        auth_method: { type: string, enum: [token, basic, ssh] }
        token:       { type: string }
        user:        { type: string }
        password:    { type: string }

    OriginSetResponse:
      type: object
      required: [status, _links]
      properties:
        status: { type: string, enum: [ok] }
        _links: { $ref: "#/components/schemas/LinkMap" }

    OriginSessionSummary:
      type: object
      required: [session_id, state]
      properties:
        session_id: { type: string }
        state:      { type: string, enum: [created, tested, previewed, applied, committed, error] }
        url:        { type: string }

    OriginSessionsCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                sessions:
                  type: array
                  items: { $ref: "#/components/schemas/OriginSessionSummary" }

    OriginSessionDetail:
      allOf:
        - $ref: "#/components/schemas/OriginSessionSummary"
        - type: object
          required: [_links]
          properties:
            history:      { type: string, enum: [shared, disjoint] }
            last_preview: { type: object, additionalProperties: true }
            last_apply:   { type: object, additionalProperties: true }
            _links:       { $ref: "#/components/schemas/LinkMap" }

    OriginApplyRequest:
      type: object
      required: [conflict_strategy]
      properties:
        conflict_strategy:
          type: string
          enum: [local_wins, remote_wins]
        branch:
          type: string
          description: Optional remote branch override.

    UpstreamRequest:
      type: object
      required: [branch]
      properties:
        branch:
          type: string
          description: |
            Upstream branch to track on origin. Required and non-empty;
            rejected with 400 if it contains characters not allowed in a git
            ref.

    UpstreamSetResponse:
      type: object
      required: [status, branch, _links]
      properties:
        status: { type: string, enum: [ok] }
        branch: { type: string }
        _links: { $ref: "#/components/schemas/LinkMap" }

    # Lenses
    LensMember:
      type: object
      description: |
        A lens member repo. `uid` is the registry key and the ONLY identifier
        requests may send; `name` is derived, read-only, and ignored on input.
        Sending a bare repo-name string where this object is expected is a 400.
      required: [uid]
      properties:
        uid:  { type: string, description: "Registry uid, from `GET /repos`. Survives renames and store swaps." }
        name:
          type: string
          readOnly: true
          description: "Current display name. Response-only — ignored on input."

    LensRead:
      allOf:
        - $ref: "#/components/schemas/LensMember"
        - type: object
          properties:
            branch: { type: string, description: "Pinned branch. Omitted means the repo's own default." }
            source: { type: string, description: Provenance of the mount. }

    Lens:
      type: object
      required: [name, write, reads, created_at, updated_at, _links]
      properties:
        name:        { type: string, description: Immutable once created. }
        write:       { $ref: "#/components/schemas/LensMember" }
        description: { type: string }
        reads:
          type: array
          description: |
            Read mounts, sorted by resolved repo NAME — the same order the lens
            fans out to. Includes the write repo, which is always a member.
          items: { $ref: "#/components/schemas/LensRead" }
        created_at:  { type: integer, format: int64, description: Unix seconds. }
        updated_at:  { type: integer, format: int64, description: Unix seconds. }
        _links:      { $ref: "#/components/schemas/LinkMap" }

    LensesCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionBase"
        - type: object
          properties:
            _embedded:
              type: object
              properties:
                lenses:
                  type: array
                  items: { $ref: "#/components/schemas/Lens" }

    LensCreateRequest:
      type: object
      required: [name, write]
      properties:
        name:        { type: string }
        write:       { $ref: "#/components/schemas/LensMember" }
        description: { type: string }
        reads:
          type: array
          items: { $ref: "#/components/schemas/LensRead" }

    LensPatchRequest:
      type: object
      description: |
        Every field is optional. An absent key keeps the current value; a
        present key replaces it wholesale. `reads` replaces as a set — it never
        merges. The name cannot be patched here; it is not immutable, though —
        use POST /lenses/{lens}/rename, which exists as its own route because
        the response must be re-read through the new name.
      properties:
        write:       { $ref: "#/components/schemas/LensMember" }
        description: { type: string }
        reads:
          type: array
          items: { $ref: "#/components/schemas/LensRead" }

    LensSource:
      type: object
      description: The mount a union row came from.
      required: [repo, id, branch]
      properties:
        repo:   { type: string, description: Mount repo name. }
        id:     { type: string, description: 12-character repo ID used in `kb://<id12>/…` paths. }
        branch: { type: string, description: Branch the row was read at. }

    LensFactItem:
      type: object
      required: [path, title, score, source]
      properties:
        path:         { type: string, description: "Bare for the write repo, `kb://<id12>/…` for a read mount." }
        title:        { type: string }
        kind:         { type: string, description: Omitted when epistemic (the default). }
        type:         { type: string }
        committed_at: { type: integer, format: int64 }
        operation:    { type: string }
        score:        { type: number, format: double }
        source:       { $ref: "#/components/schemas/LensSource" }

    LensFactsResponse:
      type: object
      description: |
        Flat envelope mirroring the MCP query response — not the HAL collection
        envelope. A lens read collection has no per-branch anchor, so it carries
        no `_links`.
      required: [facts, total]
      properties:
        facts:
          type: array
          items: { $ref: "#/components/schemas/LensFactItem" }
        total:
          type: integer
          description: Post-dedupe union size; `limit`/`offset` page within it.

    LensFact:
      allOf:
        - $ref: "#/components/schemas/Fact"
        - type: object
          required: [source]
          properties:
            source: { $ref: "#/components/schemas/LensSource" }

    LensSearchItem:
      type: object
      required: [path, title, score, source]
      properties:
        path:       { type: string, description: "Bare for the write repo, `kb://<id12>/…` for a read mount." }
        title:      { type: string }
        score:      { type: number, format: double }
        kind:       { type: string, description: Omitted when epistemic (the default). }
        type:       { type: string }
        domain:     { type: array, items: { type: string } }
        entities:   { type: array, items: { type: string } }
        confidence: { type: number, format: double }
        source:     { $ref: "#/components/schemas/LensSource" }

    LensSearchResponse:
      type: object
      required: [results, total]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/LensSearchItem" }
        total: { type: integer }

    LensCompletions:
      type: object
      required: [values]
      properties:
        values:
          type: array
          items: { type: string }

    LensRepoStats:
      type: object
      required: [id, name, source, branch, is_write, total, avg_confidence, domains, entities, last_commit, changes_7d, changes_30d, changes_90d]
      properties:
        id:             { type: string, description: 12-character repo ID. }
        name:           { type: string }
        source:         { type: string }
        branch:         { type: string }
        is_write:       { type: boolean, description: True for the lens's write repo. }
        total:          { type: integer }
        avg_confidence: { type: number, format: double }
        domains:        { type: object, additionalProperties: { type: integer } }
        entities:       { type: object, additionalProperties: { type: integer } }
        last_commit:    { type: string }
        changes_7d:     { type: integer }
        changes_30d:    { type: integer }
        changes_90d:    { type: integer }

    LensStats:
      type: object
      required: [total, repo_count, last_commit, avg_confidence, domains, entities, types, highlights, default_axis, repos]
      properties:
        total:          { type: integer, description: Sum across mounts. }
        repo_count:     { type: integer }
        last_commit:    { type: string, description: Most recent commit across mounts. }
        avg_confidence: { type: number, format: double, description: Count-weighted mean across mounts. }
        domains:        { type: object, additionalProperties: { type: integer }, description: "Summed across mounts; `{}` when empty, never null." }
        entities:       { type: object, additionalProperties: { type: integer }, description: "Summed across mounts; `{}` when empty, never null." }
        types:          { type: object, additionalProperties: { type: integer }, description: "Summed across mounts; `{}` when empty, never null." }
        highlights:
          type: array
          maxItems: 10
          description: |
            Deduped global top 10 across mounts — NOT per-mount. Each mount
            contributes its own top 10, which are merged and re-ranked. `[]`
            when empty, never null.
          items: { $ref: "#/components/schemas/Highlight" }
        default_axis:
          type: string
          enum: [impact, confidence]
          description: >
            Server's union-wide recommendation, from the SAME ratio rule as
            the repo-scoped `Stats.default_axis`, applied to each mount's
            top-layer/observation fact counts and DERIVED_FROM out-degree
            SUMMED across every mount — not a per-mount vote. A mount with no
            eligible facts contributes nothing to either side of the ratio
            and cannot veto the others.
        repos:
          type: array
          description: Per-mount breakdown.
          items: { $ref: "#/components/schemas/LensRepoStats" }

    LensTopicSource:
      type: object
      required: [repo, id]
      properties:
        repo: { type: string }
        id:   { type: string, description: 12-character repo ID. }

    LensTopicChild:
      type: object
      required: [name, is_dir]
      properties:
        name:   { type: string }
        is_dir: { type: boolean }
        type:   { type: string }
        title:  { type: string }
        path:   { type: string, description: "Leaf entries only: the lens wire address of the fact." }
        source:
          allOf: [{ $ref: "#/components/schemas/LensTopicSource" }]
          description: |
            Leaf entries only. Directories carry no per-mount payload — they are
            deduped by shared topic vocabulary across mounts.

    LensTopics:
      type: object
      required: [path, children]
      properties:
        path: { type: string, description: The ontology-rooted path of this node. }
        children:
          type: array
          items: { $ref: "#/components/schemas/LensTopicChild" }

    # Ontologies (pre-create wizard helpers)
    OntologyDiagnostic:
      type: object
      required: [line, column, message]
      properties:
        line:    { type: integer, description: 1-based line number in the submitted YAML. }
        column:  { type: integer, description: 1-based column number. }
        message: { type: string }

    OntologyValidateResponse:
      type: object
      required: [ok, id, name, topics, rule_count]
      description: |
        ok:true carries the parsed ontology's summary (id, name, topics,
        rule_count); ok:false carries diagnostics instead — every diagnostic
        found, not just the first — and id/name/topics/rule_count are present
        but zero-valued in that case, not meaningful.
      properties:
        ok:
          type: boolean
        id:
          type: string
          description: The ontology's own id field. Empty when ok is false.
        name:
          type: string
          description: Empty when ok is false.
        topics:
          type: array
          items: { type: string }
          description: Empty when ok is false.
        rule_count:
          type: integer
          description: Total validations declared at the root and on every node. 0 when ok is false.
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/OntologyDiagnostic" }
          description: Present only when ok is false.

    OntologyPresetSummary:
      type: object
      required: [name, id, title, description, topics]
      properties:
        name:
          type: string
          description: Preset identifier — used in the URL and in CreateRepoRequest.ontology_preset.
        id:
          type: string
          description: The ontology's own id field.
        title:       { type: string }
        description: { type: string }
        topics:
          type: array
          items: { type: string }

    OntologyPresetsResponse:
      type: object
      required: [presets]
      properties:
        presets:
          type: array
          items: { $ref: "#/components/schemas/OntologyPresetSummary" }

    OntologySchemaField:
      type: object
      required: [struct, field, doc]
      description: One ontology YAML key, for the create wizard's editor completions.
      properties:
        struct:
          type: string
          description: The Go struct this YAML key belongs to (Ontology, OntologyNode, or Validation).
        field:
          type: string
          description: The YAML key name.
        doc:
          type: string
          description: One-line description.

    OntologySchemaResponse:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items: { $ref: "#/components/schemas/OntologySchemaField" }
