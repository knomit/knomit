  /repos/{repo}/origin:
    parameters:
      - $ref: "#/components/parameters/Repo"
    get:
      tags: [origin]
      summary: Get configured remote origin
      operationId: getOrigin
      responses:
        "200":
          description: Origin configuration
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Origin" }
        "204": { description: No origin configured }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    put:
      tags: [origin]
      summary: Configure remote origin
      operationId: setOrigin
      description: |
        Points an EXISTING repository at a remote.

        409 when that remote is a different knowledge base — it carries an
        ontology whose id is not this repository's. A repository's ontology is
        fixed when it is created and is never editable afterwards, so two
        taxonomies cannot govern one repository: every fact already written was
        validated against the local one, and every fact arriving from the remote
        was validated against the other. The `detail` names both ids.

        A remote that is NOT a knowledge base is accepted — that is how an
        existing local repository gets backed up, and knomit carries its
        ontology to the remote on agent/<host>. So is a remote holding the SAME
        knowledge base, which is the ordinary case when re-attaching a repo to
        its own remote. A remote that could not be read refuses nothing: it
        establishes neither answer, and the create-time checks still apply to
        anything it later turns out to be.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OriginConfigRequest" }
      responses:
        "200":
          description: Origin configured
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/OriginSetResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [origin]
      summary: Remove origin configuration
      operationId: deleteOrigin
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /repos/{repo}/origin/upstream:
    parameters:
      - $ref: "#/components/parameters/Repo"
    patch:
      tags: [origin]
      summary: Set the upstream branch tracked on origin
      description: |
        Changes only the upstream branch of the already-configured origin; the
        URL and credentials are untouched. The branch name is validated against
        a conservative subset of git's ref-name rules before it is written into
        the fetch refspec.
      operationId: setOriginUpstream
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpstreamRequest" }
      responses:
        "200":
          description: Upstream branch set
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/UpstreamSetResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

