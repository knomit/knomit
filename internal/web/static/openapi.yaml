openapi: 3.0.3
info:
  title: Knomit API
  version: 2.1.0
  description: |
    Git-backed knowledge base API (HAL/HATEOAS).

    All successful responses are `application/hal+json` (except SSE streams
    and the raw OpenAPI spec). Collection responses use an envelope with
    `count`, `_links`, and `_embedded.<rel>`. All error responses are
    RFC 9457 `application/problem+json`.

servers:
  - url: /api/v1
    description: v1

tags:
  - name: discovery
  - name: repos
  - name: ontologies
    description: |
      Repo-independent ontology helpers the create wizard calls before any
      repo exists — validate custom YAML, list built-in presets, fetch a
      preset's YAML, and read the field reference backing editor completions.
  - name: archive
    description: Archived-repo lifecycle — list, restore, and purge archived repos
  - name: lenses
    description: |
      Lenses — a named federation of one write repo plus N read mounts. The
      lens read endpoints (`/facts`, `/facts/{path}`, `/search`,
      `/completions`, `/stats`, `/topics`) fan out over every mount, dedupe
      by repo-relative path with the write mount winning, and qualify
      read-mount paths as `kb://<id12>/…`. They use flat envelopes (not the
      HAL collection envelope) mirroring the MCP query response shape.
  - name: branches
  - name: facts
  - name: topics
  - name: search
  - name: stats
  - name: commits
  - name: jobs
  - name: origin
  - name: events
  - name: mcp

paths:
  /:
    get:
      tags: [discovery]
      summary: API root
      operationId: getRoot
      responses:
        "200":
          description: Root with discovery links
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Root" }

  /version:
    get:
      tags: [discovery]
      summary: Build version of the running server
      operationId: getVersion
      responses:
        "200":
          description: Semver, short commit, and the combined full version string
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Version" }

  /openapi.yaml:
    get:
      tags: [discovery]
      summary: OpenAPI 3 specification (YAML)
      operationId: getOpenAPISpec
      responses:
        "200":
          description: OpenAPI spec
          content:
            application/yaml:
              schema: { type: string }

  /repos:
    get:
      tags: [repos]
      summary: List repositories
      operationId: listRepos
      responses:
        "200":
          description: Collection of repos
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/ReposCollection" }
        "500": { $ref: "#/components/responses/Problem" }
    post:
      tags: [repos]
      summary: Create a repository
      description: |
        Starts repo creation and returns `202 Accepted` immediately with the
        job's `create_id` and a `Location` header pointing at
        `/repo-creates/{id}`. Poll that resource for progress and for the
        terminal outcome.

        THE RESPONSE DOES NOT HOLD THE WORK. The create runs on the server's
        own bounded context with its own deadline, so it is unaffected by what
        the client does next: disconnecting, never polling, or polling from a
        different session all leave the create running to the same terminal
        state. This is deliberate — the previous shape streamed progress until
        the create finished and scoped the work to the request, which meant a
        closed browser tab could cancel a clone that had already completed.

        Because the outcome outlives the connection, a create that fails or
        exceeds its deadline is still readable afterwards, for a limited
        retention window, at `/repo-creates/{id}`. A failed create leaves NO
        repo behind: the partial database and the registry row are rolled back
        before the job becomes terminal.

        409 covers several distinct conflicts: the name is already taken, the
        origin URL is already in use by another active repo, a create for the
        same name/origin is already in flight, or the remote is in a state the
        requested mode cannot work with. That last group is three cases, and
        each names the mode that would have worked:

        - the remote has NO branches (mode=initialize and mode=clone alike) —
          there is nothing to cut an agent branch from, and knomit never
          creates a branch on a remote other than its own. Create a `main`
          first; one commit is enough.
        - the branch has no ontology, so it is not a knowledge base to join
          (mode=clone) — use mode=initialize.
        - the branch already has one (mode=initialize) — use mode=clone.

        All three checks run BEFORE the 202 is committed, from the server's own
        probes of the origin rather than anything trusted from an earlier
        client-side probe — which is what makes these 409s reachable at all.
        A condition that can only be produced once the job has started is not
        a 409 to any client; it surfaces as a `failed` poll result instead.

        They are deliberately narrow. Only a remote the server could actually
        see is refused: one that is unreachable, or that needs credentials the
        request did not carry, establishes nothing either way, so it proceeds
        and fails as a `failed` poll result instead. Create re-asserts all
        three conditions itself regardless — the pre-flight probes are
        advisory, and a remote can change in between.

        The ontology question is asked of the branch the create will actually
        READ, which is not always the branch named: when the remote already
        carries this machine's agent branch, that branch is adopted, and it is
        the one inspected. `/repos:probe-initialized` applies the same rule and
        reports which branch it looked at.

        413 is returned when the request body exceeds the ontology size cap
        (the same cap `/ontologies:validate` enforces).
      operationId: createRepo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepoRequest" }
      responses:
        "202":
          description: |
            Creation accepted and started. The body is the job's first status
            snapshot — the same shape `/repo-creates/{id}` returns — so a
            client needs to parse only one thing.
          headers:
            Location:
              description: URL of the create job to poll.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCreateStatus"
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }

  /repo-creates/{id}:
    get:
      tags: [repos]
      summary: Read the status of a repo-create job
      description: |
        Reports a detached create's progress while it runs and its terminal
        outcome after it ends. This is the poll target `POST /repos` hands back.

        A SIBLING of `/repos` rather than a path beneath it, on purpose: repo
        names use the alphabet `[a-z0-9_-]`, so `creates` is a legal repo name,
        and a `/repos/creates/{id}` route would shadow every route belonging to
        a repo actually called that.

        Finished jobs are retained for a limited window (one hour) so a client
        that lost its connection can still learn how the create ended. After
        that the job is reaped and this returns 404 — the same answer as an id
        that never existed, because a client cannot act differently on the two,
        and `GET /repos/{repo}` is the authoritative answer to whether the repo
        exists.
      operationId: getRepoCreate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current status of the create job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCreateStatus"
        "404": { $ref: "#/components/responses/Problem" }

  /repos:probe-origin:
    post:
      tags: [repos, origin]
      summary: Probe a remote origin before create
      description: |
        Inspects a remote without cloning it (`remote.ListContext` — REFS
        ONLY), so the create wizard learns whether the remote is reachable,
        which branches it has, whether it needs credentials, and whether it
        advertises push access — before asking the user to declare any of it.
        Filesystem origins are routed through the same local-origin gate as
        every clone/fetch path — no exemption.

        It answers questions about the REMOTE. Whether a given BRANCH already
        holds a knowledge base is a different question with a different answer
        per branch, and is served by `/repos:probe-initialized`.

        A remote with NO branches is a blocked state, not a mode: knomit never
        creates a branch on a remote other than its own agent branch, so there
        would be nothing to cut that branch from. The wizard asks the user to
        create a `main` first — one commit is enough.

        The result is advisory, not authority: a remote can change between the
        probe and the create, so create re-asserts what it needs itself.

        Unreachable and auth-required come back as 200 results with the
        corresponding flag set, NOT HTTP errors — both are states the wizard
        renders and recovers from. Only a refused request (a missing url, or
        a local origin the local-origin gate rejects) is a 400.
      operationId: probeOrigin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProbeOriginRequest" }
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeOriginResult" }
        "400": { $ref: "#/components/responses/Problem" }

  /repos:probe-initialized:
    post:
      tags: [repos, origin]
      summary: Is this branch of a remote already a knomit knowledge base?
      description: |
        A repository is a knomit knowledge base IF AND ONLY IF it has an
        ontology at `.knomit/ontology.yaml` (legacy rungs `.domains/` and
        `domains/` are also read). Nothing else makes one — not being
        non-empty, not having commits, not having a `main`.

        This endpoint answers that one question for ONE branch, and its answer
        decides the create mode: present means `clone` (its ontology governs),
        absent means `initialize` (knomit writes one onto its own agent branch,
        cut from that branch's tip).

        Separate from `/repos:probe-origin` because the answer is per-branch —
        a repository can carry the ontology on `main` and not on `develop` —
        and because the branch is not known when that probe runs. It is also a
        heavier call: a `depth=1`, single-branch, no-tags clone into memory,
        read for its tip tree and discarded.

        THREE STATES, and the third is not a formality. `initialized` is
        `"yes"`, `"no"`, or ABSENT — absent meaning the check did not complete.
        Clients MUST NOT collapse the absent case into either answer. A repo's
        ontology is fixed at create time and never user-editable afterwards, so
        guessing "yes" discards the ontology the user chose and guessing "no"
        writes one over a knowledge base that already had its own. Both are
        unrecoverable; the wizard blocks and offers a retry instead.

        Every outcome — including a remote that could not be read, a branch
        that does not exist, and a remote with no refs at all — is a 200 with
        the field absent and a `detail`. Only a refused request (a missing url,
        or a local origin the local-origin gate rejects) is a 400.
      operationId: probeInitialized
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProbeInitializedRequest" }
      responses:
        "200":
          description: Initialization check result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeInitializedResult" }
        "400": { $ref: "#/components/responses/Problem" }

  /ontologies:validate:
    post:
      tags: [ontologies]
      summary: Validate ontology YAML
      description: |
        Parses and validates a raw ontology YAML document without persisting
        anything, for the create wizard's custom-ontology editor.

        Always 200: an ontology that fails to parse or validate returns
        `ok:false` with the full diagnostics list (every problem found, not
        just the first), never an HTTP error — a 4xx is reserved for a body
        the server could not even read.
      operationId: validateOntology
      requestBody:
        required: true
        content:
          text/yaml:
            schema: { type: string }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OntologyValidateResponse" }
        "413": { $ref: "#/components/responses/Problem" }

  /ontologies/presets:
    get:
      tags: [ontologies]
      summary: List built-in ontology presets
      operationId: listOntologyPresets
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OntologyPresetsResponse" }

  /ontologies/presets/{name}:
    parameters:
      - { name: name, in: path, required: true, description: "Preset identifier (e.g. default, code).", schema: { type: string } }
    get:
      tags: [ontologies]
      summary: Get a preset's ontology YAML
      description: |
        Returns the same serialized form that create would commit — the
        wizard seeds its custom-ontology editor from this.
      operationId: getOntologyPreset
      responses:
        "200":
          description: Ontology YAML
          content:
            text/yaml:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Problem" }

  /ontologies/schema:
    get:
      tags: [ontologies]
      summary: Ontology YAML field reference
      description: |
        The field list backing the editor's completions, served from Go so
        there is exactly one description of the ontology shape.
      operationId: getOntologySchema
      responses:
        "200":
          description: Field list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OntologySchemaResponse" }

  /repos/{repo}:
    parameters:
      - $ref: "#/components/parameters/Repo"
    get:
      tags: [repos]
      summary: Get repository
      operationId: getRepo
      responses:
        "200":
          description: Repository
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Repo" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [repos]
      summary: Update repository description and/or license
      description: |
        Edits the repo's description and/or license. `description` is the
        verbatim content of the `README.md` root manifest; `license` is the
        verbatim content of `LICENSE`. Each field's new content is committed
        to its own file on the repo's agent branch, so the change is part of
        the repo's git history and syncs with it. The two fields are
        independent — a patch may edit either one, or both, without disturbing
        the other.

        Both fields are stored byte-for-byte — no normalization. For each
        field, omitting it leaves the corresponding file unchanged; an
        explicit empty string empties the file (the file stays, and the field
        is then absent from the response). The maximum size for each is
        65536 bytes; a larger request body is refused with 413 before it is
        read, and an over-cap value with 422.

        Content identical to the current file is accepted but makes no
        commit, so re-saving unchanged text does not grow the branch.

        `license` has one more failure mode: if the LICENSE already on the
        agent branch exceeds 65536 bytes (see `license_oversize` on `Repo`),
        this call cannot read it back to safely diff or replace it, so any
        `license` value — including an empty string — is refused with 409
        rather than committed. The existing file is left untouched.

        The response is the re-read repository view, identical in shape to GET.
      operationId: updateRepo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Markdown content for README.md; omit to keep the current manifest.
                  maxLength: 65536
                license:
                  type: string
                  description: Verbatim content for LICENSE; omit to keep the current file.
                  maxLength: 65536
      responses:
        "200":
          description: Repository updated
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Repo" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [repos]
      summary: Archive a repository
      description: |
        Moves the repo to the archive and returns the archived-repo record.
        ANY repo may be archived, including the last one — zero repos is a valid
        state. 409 means the name is contested (a lens still mounts this repo,
        or an operation on it is already in flight), not that this repo is
        privileged.

        Archiving needs a live store to shut down, so it resolves the name
        through the live repo map: a registered repo with no store (see
        `RepoSummary.state`) answers 404 here, the same as a name that was never
        registered. There is currently no way to remove such a registration.

        `archivedAt` is a whole-second RFC 3339 timestamp — the same value
        `GET /archived` reports for this record afterwards.
      operationId: archiveRepo
      responses:
        "200":
          description: Repository archived
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/ArchivedRepo" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /repos/{repo}/rename:
    parameters:
      - $ref: "#/components/parameters/Repo"
    post:
      tags: [repos]
      summary: Rename a repository
      description: |
        A custom action rather than PATCH /repos/{repo}: the response re-reads
        the repo through the NEW name, and a rename invalidates the very
        identifier the request was addressed by, so the write and its
        response cannot share one resource. Renaming to the current name is
        a successful no-op. 409 covers both an actively-held name (repo or
        lens — the two share one namespace) and the repo named in the URL
        having changed underneath the request (it still exists, just not
        under `{repo}` any more; re-read and retry). A 404 comes from
        RepoMiddleware, which resolves `{repo}` before this handler runs — an
        unknown repo never reaches the rename itself. That is why 404 and 409
        are both listed and mean different things here: 404 is "no such repo
        to begin with", 409 is "it was there and moved mid-request".
      operationId: renameRepo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameRequest" }
      responses:
        "200":
          description: Repository renamed; response addresses it by the new name
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Repo" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /repos/{repo}/branches:
    parameters:
      - $ref: "#/components/parameters/Repo"
    get:
      tags: [branches]
      summary: List branches
      operationId: listBranches
      responses:
        "200":
          description: Collection of branches
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/BranchesCollection" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /repos/{repo}/branches/{branch}:
    parameters:
      - $ref: "#/components/parameters/Repo"
      - $ref: "#/components/parameters/Branch"
    get:
      tags: [branches]
      summary: Branch root with discoverable links
      operationId: getBranch
      responses:
        "200":
          description: Branch
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Branch" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /repos/{repo}/branches/{branch}/facts:
    parameters:
      - $ref: "#/components/parameters/Repo"
      - $ref: "#/components/parameters/Branch"
    get:
      tags: [facts]
      summary: List facts (recent, filtered, paginated)
      operationId: listFacts
      parameters:
        - { name: limit,          in: query, description: "1–500; out-of-range or non-integer is 400.", schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: offset,         in: query, description: "Non-negative; negative or non-integer is 400.", schema: { type: integer, default: 0, minimum: 0 } }
        - { name: path,           in: query, schema: { type: string } }
        - { name: topic,          in: query, description: "Ontology-root subdirectory shorthand: `topic=invariants` → `path=kb/invariants/`. An explicit `path=` always wins.", schema: { type: string } }
        - { name: q,              in: query, schema: { type: string } }
        - { name: domain,         in: query, description: "CSV. Always the default containment/hierarchy match — unlike `/search`, this endpoint has no `domain_exact` switch.", schema: { type: string } }
        - { name: entity,         in: query, description: "CSV. Canonical name; merges with the `entities` alias.", schema: { type: string } }
        - { name: entities,       in: query, description: "CSV. Back-compat alias for `entity`; values merge.", schema: { type: string } }
        - { name: type,           in: query, description: CSV, schema: { type: string } }
        - { name: exclude_type,   in: query, description: CSV, schema: { type: string } }
        - { name: kind,           in: query, description: "CSV (epistemic/pragmatic).", schema: { type: string } }
        - { name: exclude_kind,   in: query, description: CSV, schema: { type: string } }
        - { name: origin,         in: query, description: CSV, schema: { type: string } }
        - { name: ep,             in: query, description: CSV (episode operations), schema: { type: string } }
        - $ref: "#/components/parameters/MotifFilter"
        - $ref: "#/components/parameters/MotifMatchTier"
        - { name: min_confidence, in: query, description: "Non-numeric is 400.", schema: { type: number, format: double } }
      responses:
        "200":
          description: Collection of facts
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/FactsCollection" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    post:
      tags: [facts]
      summary: Create a fact
      operationId: createFact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactCreateRequest" }
      responses:
        "201":
          description: Fact created
          headers:
            Location:
              schema: { type: string }
              description: URI of the new fact
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Fact" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /repos/{repo}/branches/{branch}/facts/{path}:
    parameters:
      - $ref: "#/components/parameters/Repo"
      - $ref: "#/components/parameters/Branch"
      - $ref: "#/components/parameters/FactPath"
    get:
      tags: [facts]
      summary: Read a fact (anchored at HEAD)
      description: |
        When the path terminates with `/incoming` or `/outgoing`, the response
        is a `RefsCollection` of referencing/referenced facts instead of a
        fact view. Each entry carries a `commit` field pinning it to a
        specific version (source for `/incoming`, target for `/outgoing`)
        and `_links.self` is anchored to that commit.
      operationId: getFact
      responses:
        "200":
          description: Fact or ref collection
          content:
            application/hal+json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Fact" }
                  - { $ref: "#/components/schemas/RefsCollection" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    put:
      tags: [facts]
      summary: Update a fact (full content replace)
      operationId: updateFact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactUpdateRequest" }
      responses:
        "200":
          description: Updated fact
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Fact" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [facts]
      summary: Delete a fact
      operationId: deleteFact
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /repos/{repo}/branches/{branch}/facts/{path}/commits:
    parameters:
      - $ref: "#/components/parameters/Repo"
      - $ref: "#/components/parameters/Branch"
      - $ref: "#/components/parameters/FactPath"
    get:
      tags: [facts, commits]
      summary: Per-fact commit log
      description: |
        Returns commits that touched the given fact path, in reverse chronological
        order. Used by the version walker (right-pane fact header) and the commit
        drawer's "this fact · N versions" section.
      operationId: factCommits
      parameters:
        - { name: limit,  in: query, description: "1–500; out-of-range or non-integer is 400.", schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: after,  in: query, schema: { type: string }, description: cursor }
        - { name: from,   in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: string } }
      responses:
        "200":
          description: Collection of commits touching the fact
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/CommitsCollection" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /repos/{repo}/branches/{branch}/commits/{sha}/facts/{path}:
    parameters:
      - $ref: "#/components/parameters/Repo"
      - $ref: "#/components/parameters/Branch"
      - $ref: "#/components/parameters/Sha"
      - $ref: "#/components/parameters/FactPath"
    get:
      tags: [facts, commits]
      summary: Read a fact anchored at a specific commit
      description: |
        When the path terminates with `/incoming` or `/outgoing`, the
        response is a `RefsCollection` of referencing/referenced facts at
        this anchor instead of a fact view. Each entry's `commit` field
        and `_links.self` are pinned to the entry's own version:
        - `/incoming` items carry `commit = source_commit` (the commit
          that asserted the ref); `_links.self` points to the source
          fact at that commit.
        - `/outgoing` items carry `commit = target_commit` (the version
          of the target the ref resolved to at the anchor); `_links.self`
          points to the target fact at that commit. `deleted=true` items
          omit `_links.self`.
      operationId: getFactAtCommit
      parameters:
        - name: fallback
          in: query
          description: |
            `before` resolves the fact to its last valid version at or before
            the anchor commit instead of requiring a version at exactly this
            commit. The `/incoming` and `/outgoing` sub-resources follow the
            same gate: without it a fact retracted before the anchor is a 404;
            with it, only a fact that never existed in the ancestry 404s.
          schema: { type: string, enum: [before] }
      responses:
        "200":
          description: Fact as of the commit, or refs collection
          content:
            application/hal+json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Fact" }
                  - { $ref: "#/components/schemas/RefsCollection" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }

  /repos/{repo}/branches/{branch}/commits/{sha}/topics:
    parameters:
      - $ref: "#/components/parameters/Repo"
      - $ref: "#/components/parameters/Branch"
      - $ref: "#/components/parameters/Sha"
    get:
      tags: [topics, commits]
      summary: Browse ontology at a specific commit (not implemented)
      operationId: getTopicsAtCommit
      responses:
        "501": { $ref: "#/components/responses/Problem" }

  /repos/{repo}/branches/{branch}/commits/{sha}/topics/{path}:
