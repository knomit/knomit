name: Tests

# The test suite, factored out as a REUSABLE workflow so the two callers run
# the identical definition rather than two copies that drift:
#
#   ci.yml            — dev/master pushes and PRs
#   release-stable.yml — gates `publish`, so no signed release is ever cut
#                        from a tree that failed here
#
# The gate is why this is a separate file. A release publishes an immutable,
# signed artifact that macOS clients then install themselves, and a tag can
# name any commit — "it was green on master" is a convention, not a guarantee.
# Duplicating the jobs into release-stable.yml would gate on a copy that
# silently stops matching CI the first time either side is edited.
#
# ONE CONSEQUENCE OF THAT, NOW THAT WINDOWS IS HERE: `publish` waits on the
# Windows legs too, including the ~30-minute internal/synthesize one, and a
# Windows-only failure blocks a macOS release. That is the same gate working as
# designed — a tree that fails on a platform we support is not a tree to cut a
# signed release from — but it is a new cost, and decoupling it would mean an
# input on this workflow rather than a second copy of these jobs.
#
# Cross-platform build + test. The pluggable embedder links daulet/tokenizers'
# libtokenizers.a statically (CGo) and loads ONNX Runtime at
# runtime, so this matrix proves the native-lib wiring resolves on each OS.
#
# WINDOWS IS IN THE MATRIX, and it is here for a specific failure. The memguard
# fail-open bug (shipped in #211, fixed in #212) matched forward-slash paths
# only, so on Windows the guard allowed every write it exists to deny — and
# nothing anywhere went red, because no CI job ran this suite on Windows. It
# was found by a person running the tests by hand. A platform nobody's CI runs
# is a platform whose bugs are silent, and that is the whole argument for the
# cost of the legs below.
#
# WINDOWS-2025, NOT WINDOWS-LATEST. This leg exists to catch OUR regressions,
# not the image's migrations. `windows-latest` is a moving alias — GitHub
# migrates it gradually over a month or two — and on Windows the toolchain is
# the IMAGE's, not ours: the compiler, the Rust target and the C runtime all
# come from it. A silent migration would therefore change what this leg tests
# on a day nobody touched this file. The facts the Windows leg relies on, all
# from image 20260907.x (Server 2025), are:
#   - mingw-w64 gcc 15.2.0 on the machine PATH at C:\mingw64\bin, plus a
#     make.exe in the same directory — so the CGo toolchain and `make setup`
#     need no install step. NOTE it is a UCRT build while the Rust GNU target
#     is MSVCRT-flavoured; see the action for what to do if that ever bites.
#   - Rust 1.98.1 with x86_64-pc-windows-gnu already added at image build time.
#     The explicit `rustup target add` in the action is a drift guard, not a
#     requirement the image fails to meet.
#   - VC++ 2015-2022 runtime 14.51.36247, well above the >= 14.40 that
#     onnxruntime >= 1.21 needs, so ortinit_windows.go's annotation path is
#     unreachable here. The action prints the installed version every run,
#     because an image rollback is the one way this paragraph goes quietly
#     wrong.
# When the pin is eventually retired, re-read those four facts before moving to
# the next one.
#
# WHAT THE RUNNER DOES NOT GIVE US, and this file supplies:
#   - sqlite3.h. sqlite-vec-go-bindings/cgo includes it and ships no copy;
#     ubuntu has it from libsqlite3-dev and macos from the SDK, and C:\mingw64
#     has it from nowhere. The action installs MSYS2's
#     mingw-w64-x86_64-sqlite3. This was an UNDECLARED requirement until this
#     job's first run died on it: #212's Windows build worked because that one
#     machine happened to carry the package. The Makefile's setup target and
#     README now say so too.
#   - A cache for dist/<goos>-<goarch>/lib, on ALL THREE platforms. On Windows
#     it is there because daulet/tokenizers publishes no Windows artifact
#     (darwin/linux only through v1.27.0), so fetchlibs BUILDS libtokenizers.a
#     from source there — clone the pinned tag, run cargo — before a single
#     test executes. MEASURED on this image: the whole Windows bootstrap is
#     ~2m40s cold (cargo itself 2m28s of it, so the ~5 minutes this used to
#     estimate is pessimistic here) and 51s-2m45s warm across three runs,
#     leaving a 15.6 MiB cache entry.
#     On ubuntu and macos the motive is RELIABILITY, not time. Both libs came
#     down from the GitHub release CDN on every single job, which is two
#     chances per job for a 5xx to red the build — job 105443136472 is one of
#     them. fetchlibs now retries transient failures too (tools/fetchlibs), so
#     a blip has to survive both a warm cache and four attempts to reach you.
#     Note what warm does NOT mean: `make setup` still costs ~50s on Windows,
#     because it compiles and runs fetchlibs before it decides both libs are
#     already there. The cache saves the download and the cargo build, not the
#     step. See .github/actions/native-toolchain, which also explains why the
#     key has no restore-keys and why extending it cost the Windows entry once.
#   - `-timeout 40m`, on the WINDOWS slow-tests legs only — ubuntu and macos
#     take 10m from the same matrix. On a Windows laptop internal/synthesize
#     (1776s) and internal/store (816s) exceed go test's 10-minute per-package
#     default outright and internal/repos (441-639s) straddles it; on THIS
#     runner only synthesize still does, at 1166-1641s across four runs.
#     Nothing hangs; it is filesystem cost, and the Makefile scopes the same
#     40m to GOOS=windows for the same reason. The slow-tests job below
#     carries both machines' numbers.
#     Every OTHER step keeps the 10-minute default deliberately: a ceiling is
#     also a hang guard, and a package that suddenly needs 40 minutes is news.
#     The package nearest that line in build-test is internal/web — 455s alone
#     on the laptop, and it shares its step with storytests and the desktop
#     helpers, which go test runs CONCURRENTLY, so its real margin is thinner
#     than 455s suggests. On the runner the whole step is 3m13s-3m55s, so this
#     is a thing to watch rather than a thing to fix: if that step ever times
#     out, internal/web is where to look first.
#
# WHAT THIS COSTS SOMEONE WAITING ON A PR. JOB durations — what the checks list
# shows, including checkout and the bootstrap — from the green legs of
# 2026-09-17:
#   build-test (windows-2025)            9m15s-12m12s  (runs 35250857183,
#                                                       35253289005)
#   slow-tests (windows-2025 synthesize) 20-30 minutes — the longest check on
#                                        the board, and see the warning below
# Do not confuse these with the PACKAGE times in the slow-tests job below:
# those are the `go test` step alone, which is what -timeout bounds, and they
# run 2-4 minutes shorter than the job that contains them. "Green legs" rather
# than green runs, because 35247045603 was red overall — on a step this block
# is not about.
#
# SYNTHESIZE IS VARIABLE, NOT BOUNDED, and that distinction is written here
# because getting it wrong cost two corrections. Four job samples on 2026-09-17
# — 20m21s, 22m43s, 26m39s, 29m17s (runs 35253289005, 35250857183,
# 35247045603, 35257034491) — a 44% spread on the same image and the same
# commit range. A stated range invites planning against its upper bound, and
# this one was exceeded by the next sample TWICE. Re-measure; do not plan
# against these.
#
# So the build answer arrives in roughly ten minutes and a FULL green waits on
# synthesize, for somewhere between twenty and thirty minutes. The unix legs
# are unchanged by any of this. If that second number is ever the thing
# standing between this repo and a merge, the fix is in internal/synthesize's
# fixtures — the tests each build a 400-fact corpus one WriteFact at a time —
# and not in this file.
#
# THE RUNNER CHECKS OUT WITH core.autocrlf=true, which is Git for Windows'
# installed default and the opposite of the machine knomit's Windows support
# was developed on. The first run of this job that got as far as running tests
# failed internal/fact's TestCorpus_RoundTripIdentical on nothing but line
# endings. The fix is the repo's new .gitattributes (`* text=auto eol=lf`), not
# a git config in this workflow: setting autocrlf=false here would have made
# the job green while leaving the failure in place for every Windows developer
# who took the installer's default — which is to say, hiding in the one job
# built to find this exactly the thing it found.
#
# THE RUNNER IS ELEVATED, and that is not a choice we have. GitHub-hosted
# Windows runners run as administrator with UAC disabled, so the process holds
# SeCreateSymbolicLinkPrivilege and the canSymlink() probes in
# internal/repos/origin_test.go and tools/desktop/bundled_test.go come back
# TRUE. Two consequences, both of them what IS rather than what we would like:
# the symlink-escape security test really does execute here (one of the reasons
# ./internal/repos/ is worth running on this leg at all), and the UNPRIVILEGED
# branch — the skip path an ordinary Windows user actually takes — is exercised
# by no CI leg on any platform and remains local-verification-only.
on:
  workflow_call:

jobs:
  build-test:
    # PINNED, because `include:` puts EVERY matrix value in the generated
    # display name: without this line the legs report as "build-test
    # (ubuntu-latest, 300s)", i.e. adding a Windows leg would have renamed the
    # ubuntu and macos checks. dev requires no status checks by name today, so
    # nothing would have hung; the ground is that a matrix value is an
    # implementation detail and a check name is an interface, and a Windows PR
    # has no business changing the other two platforms' identity. The
    # forward-looking half matters more: if required checks are ever configured
    # on dev, a matrix value added here would silently rename them out from
    # under that configuration. This reproduces the old names byte for byte —
    # any matrix value added here must keep that true.
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # contract-timeout is the ceiling on the origin-sync cells at the end
          # of this job, and it is per-platform for the same reason slow-tests
          # is: those cells drive clone/sync/push over a git server, which is
          # filesystem cost, and Windows runs that class 5-10x slower here
          # (internal/store 816s against seconds elsewhere). A unix-tuned 300s
          # applied to Windows would be a red build reporting a ceiling, not a
          # fault. unix KEEPS 300s deliberately — it is a hang guard there and
          # the cells take a fraction of it.
          - os: ubuntu-latest
            contract-timeout: 300s
          - os: macos-latest
            contract-timeout: 300s
          - os: windows-2025
            contract-timeout: 1200s
    runs-on: ${{ matrix.os }}
    # A wedged runner should not burn the 6-hour default. Same reasoning as the
    # ceiling on slow-tests, at a third of it: every step in this job is
    # measured in minutes, the slowest of them on the slowest platform being
    # the 93s of bridge+platform+cmd.
    timeout-minutes: 60
    # bash on every platform, stated once. GitHub's default shell on Windows is
    # pwsh, so without this line every `run:` below would need its own `shell:`
    # or would be read by a shell that does not know what $LIBDIR or `export`
    # are. One shell across the matrix is also what keeps the steps themselves
    # platform-neutral.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # setup-go, the Windows CGo toolchain checks, the native-lib cache and
      # `make setup`. Shared with slow-tests; see the action for the Windows
      # specifics.
      - uses: ./.github/actions/native-toolchain

      # Build every package that has buildable (non-test) Go files in the
      # default (no -tags) configuration. `{{if .GoFiles}}` drops test-only
      # packages (e.g. test/storytests); `go build` treats an
      # explicitly-listed test-only package as a fatal error, so they must not
      # appear in the argument list. The Wails desktop app under tools/desktop
      # is excluded automatically — all its files are behind `//go:build
      # desktop`, so without the tag the package has no GoFiles — which means
      # this step also proves the cloud build stays Wails-free. The desktop app
      # is built + tested separately in the `desktop` job below.
      - name: Build (CGo) — proves libtokenizers.a links + cloud is Wails-free
        run: CGO_ENABLED=1 go build $(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./...)

      # The ONLY job in CI that compiles tools/desktop's Windows-tagged files.
      # The `desktop` job below runs on macos-latest, and the step above drops
      # tools/desktop entirely (no -tags desktop, so the package has no GoFiles),
      # which left `//go:build desktop && windows` files — console_windows.go,
      # reveal_windows.go — compiled by NOTHING. They are the files most likely
      # to rot unnoticed: both reach kernel32 through lazy procs and syscall
      # structs that no other platform type-checks, so a bad signature is a
      # runtime surprise on the one platform nobody's compiler was checking.
      # Same argument as the Windows leg itself (see the header).
      #
      # COMPILE, VET, AND THE ONE WINDOWS-ONLY TEST. This leg already costs
      # ~30 minutes, and the rest of the desktop tests run on macOS in `desktop`.
      # It rides this job because the CGo toolchain, libtokenizers.a and the ORT
      # dir are already set up above by ./.github/actions/native-toolchain.
      # `-o NUL` is Windows' /dev/null, mirroring the macOS job's `-o /dev/null`.
      #
      # The test step is scoped by `-run TestWritable` deliberately. Those are
      # the console_windows_test.go guards: hermetic, Windows-only, and
      # compiled on no other platform — so this job is the only place they can
      # ever run, and before this step they were compiled but never executed.
      # Execution is well under a second (measured); the cost is the compile,
      # which this step was already paying.
      # The REST of the desktop suite has never run on Windows (it is exercised
      # on macOS in `desktop`), so widening the pattern would add an unvetted
      # gate to a 30-minute job rather than free coverage. Widen it only after
      # making that suite pass here on purpose.
      #
      # TestBootServer_ was widened to deliberately (knomit#245). Since #248 the
      # desktop opens cfg.Socket itself, and on Windows that is now a NAMED
      # PIPE -- so boot_pipe_windows_test.go is the only coverage there is of
      # the listener the normal Windows install actually serves, and it is
      # compiled on no other platform. Made to pass here first, as the
      # paragraph above asks; measured at 0.03s for the three pipe tests.
      - name: Desktop app compiles on Windows (-tags desktop)
        if: matrix.os == 'windows-2025'
        run: |
          CGO_ENABLED=1 go build -tags desktop -o NUL ./tools/desktop
          CGO_ENABLED=1 go vet -tags desktop ./tools/desktop/...
          CGO_ENABLED=1 go test -tags desktop -run 'TestWritable|TestBootServer_' -count=1 ./tools/desktop/ 2>&1 | tee "$RUNNER_TEMP/gotest-desktop.log"

      # internal/config owns the data-root resolution, and it is per-OS code
      # whose branches only the matching runner reaches: the Windows
      # reconstruction (LOCALAPPDATA unset, USERPROFILE set) is exercised by
      # config's paths_windows_test.go and by nothing else in the tree, so it
      # needs the windows-2025 leg of this matrix. This step carries no `if:`,
      # so it runs on every platform.
      #
      # The OS half of that resolution lives in internal/platform/userdirs and
      # has per-OS tests of its own. They run in the "bridge/platform" step
      # below, via ./internal/platform/... — also on every matrix platform, so
      # the Windows branch is reached there too. BOTH halves are covered, and
      # each by a different step; if either moves, check the other still is.
      # internal/auth joined this step in 29c5594f. Keeping it here matters
      # doubly for knomit#245: its Windows named-pipe tests are the only
      # coverage the pipe transport has, and they are compiled on no other
      # platform, so a step that did not name the package would let them
      # compile and never execute on windows-2025.
      #
      # internal/pki (F19 phase 2) is pure Go with in-process fixtures: every
      # root, key and certificate its tests use is generated in t.TempDir().
      # A new package is not tested until it is named here.
      #
      # internal/oauth (F19 phase 3a) needs sqlite (control.db via
      # internal/store/migrate) but no native runtime libs, and its CIMD tests
      # run their own in-process HTTPS server with a generated CA. The `...`
      # takes in internal/oauth/idp (F19 phase 3c), whose tests drive the
      # in-process fake provider in internal/oauth/idp/idptest.
      - name: Unit tests (no model download)
        run: CGO_ENABLED=1 go test ./internal/embeddings/ ./internal/config/ ./internal/fact/ ./internal/auth/ ./internal/pki/... ./internal/oauth/... 2>&1 | tee "$RUNNER_TEMP/gotest-unit.log"

      # Guard: the test harness (test/testenv, test/storytests) must
      # never be linked into a shipped binary. Pure `go list` graph check, no
      # native libs / no compile.
      - name: Test-harness isolation guard
        run: go test ./test/archtest/

      # These link the runtime native libs: internal/web transitively (it
      # constructs a store in tests), and the desktop helper packages
      # (lockfile/netutil/paths/autostart/singleinstance) are plain Go but run
      # here too so the build-test job actually exercises them. The desktop
      # `//go:build desktop` packages are covered by the `desktop` job below.
      #
      # internal/store itself moved to the slow-tests job — 816s on Windows,
      # past go test's per-package default. It is the only package that moved.
      #
      # The two exports are INERT ON WINDOWS and are left unguarded on purpose:
      # there the loader searches PATH, not LD_LIBRARY_PATH/DYLD_LIBRARY_PATH.
      # Nothing in the default suite loads onnxruntime.dll on any platform — a
      # test binary never sits next to dist/<platform>/lib, so libCandidates()
      # misses everywhere and the real-inference tests are cache-gated to
      # embed-smoke — so this is a no-op, not a gap. If a test here ever does
      # need ORT on Windows, the spelling is ORT_LIB_PATH="$LIBDIR/onnxruntime.dll"
      # (no lib prefix on the filename; see tools/fetchlibs/spec.go ortSpec).
      - name: Story, web + desktop-helper tests (runtime native libs)
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          CGO_ENABLED=1 go test ./test/storytests/ ./internal/web/... ./tools/desktop/internal/... 2>&1 | tee "$RUNNER_TEMP/gotest-web.log"

      # NEW WITH THE WINDOWS LEG, AND HALF THE POINT OF IT. These packages were
      # COMPILED by the build step above but their tests ran on no platform in
      # any PR job — tools/bridge on no platform at all. That is where the
      # memguard fail-open bug lived: a guard that silently permitted every
      # write it exists to deny, in a package CI never executed. cmd, too,
      # covers the server's entry points, and internal/platform holds fileuri,
      # the path-spelling helper #212 introduced.
      #
      # They are here rather than in slow-tests because they are cheap even on
      # the slow platform: 93s for all of them on Windows, of which cmd is 57s.
      #
      # internal/app is the boot wiring (app.New) and was in NO list here from
      # PR #243 to PR #284: its wiring tests ran only in race.yml, post-merge,
      # where they failed for a week on an ONNX dlopen that no PR job could
      # see. They boot through Options.Embedder now, so no model and no ORT.
      - name: Bridge, platform, app + cmd tests
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          CGO_ENABLED=1 go test ./tools/bridge/... ./internal/platform/... ./internal/app/ ./cmd/ 2>&1 | tee "$RUNNER_TEMP/gotest-bridge.log"

      # Origin-sync fault matrix: build-tagged contract cells drive the real
      # product clone/sync/push path over an in-process fault-injecting git
      # server (stalls, expired tokens, wrong default branch, re-point). They
      # are behind `//go:build contract` so they stay out of the default suite;
      # this step is what actually gates them. Each cell asserts a graceful
      # contract (bounded by timeout, typed/visible error, no silent success).
      - name: Origin-sync contract cells (fault matrix)
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          CGO_ENABLED=1 go test -tags contract ./test/storytests/ -count=1 -timeout ${{ matrix.contract-timeout }} 2>&1 | tee "$RUNNER_TEMP/gotest-contract.log"

      # A RECOVERED NIL DEREFERENCE IS NOT HARMLESS ON WINDOWS/AMD64. Every
      # `go test` step above tees its output into $RUNNER_TEMP so this step
      # can read it back; the tee changes nothing else (bash here runs with
      # pipefail, so a failing go test still fails its own step).
      #
      # On unix a nil dereference in a test is a recovered panic and the log
      # line is noise. On windows/amd64 it is a hardware access violation, and
      # the kernel dispatches the exception ON THE FAULTING GOROUTINE'S STACK:
      # CONTEXT + XSTATE + EXCEPTION_RECORD plus the dispatcher frames. Go
      # reserves 4 KiB for that (runtime/stack.go stackSystem); on AMX-capable
      # Intel hosts the kernel lays out the 8 KiB XTILEDATA area too and the
      # frame measures ~11.6 KiB, so it overruns the stack into the heap span
      # beneath it. Under the Green Tea GC (default since Go 1.26) that span's
      # inline mark bits are what gets clobbered, and a LATER sweep dies with
      # "fatal error: found pointer to free object" — on whatever goroutine
      # happens to sweep that span, nowhere near the fault. golang/go#81238,
      # open; CL 828724 is the real fix and no released Go carries it.
      #
      # That is knomit#279: five build-test (windows-2025) runs between
      # 2026-09-18 and 2026-09-23 crashed exactly that way, every one right
      # after TestReadOnlyRouter_FactRouteBypassRegression drove the router
      # with a nil *repos.Manager. The test no longer does; this step is what
      # stops the NEXT one. A hit here is a bug in the test, not in this step:
      # give the test the real dependency it dereferenced.
      #
      # `!cancelled()` rather than the default success(): when a step above
      # already died of the GC fatal, the recovered fault that caused it is
      # the diagnosis, and this step is what prints it.
      - name: No hardware faults inside the Windows test process (knomit#279)
        if: matrix.os == 'windows-2025' && !cancelled()
        run: |
          if grep -n 'invalid memory address or nil pointer dereference' "$RUNNER_TEMP"/gotest-*.log; then
            echo "::error::a test took a real access violation on windows/amd64; under golang/go#81238 that corrupts the heap under the goroutine stack on AMX hosts (see this step's comment in tests.yml and knomit#279)"
            exit 1
          fi
          echo "no recovered nil dereferences in $(ls "$RUNNER_TEMP"/gotest-*.log | wc -l) go test logs"

  # The three packages that are slow ON WINDOWS ONLY, in their own job so the
  # build-test leg stays a fast answer to "did this break the build". The cost
  # is filesystem, not computation, and nothing hangs (see the Makefile's
  # GOTEST_TIMEOUT comment, which scopes the same 40m to GOOS=windows).
  #
  # MEASURED, and the two machines disagree enough that both belong here. Left
  # column is a Windows 10 laptop (what a developer running `make test` feels,
  # and what GOTEST_TIMEOUT was derived from); right is this windows-2025
  # runner, over three green runs on 2026-09-17 — re-measure rather than trust
  # them, and note that synthesize alone varied by four minutes across them:
  #
  #                     laptop      runner
  #   internal/synthesize  1776s      1166-1641s (four runs, 41% spread)
  #   internal/store        816s       212s
  #   internal/repos    441-639s       307s
  #
  # Note which way that cuts. store and repos are ~2.5x faster on the runner,
  # synthesize barely faster at all — it writes a 400-fact corpus one WriteFact
  # at a time, so it is bound by per-operation latency that a faster machine
  # does not help. synthesize is therefore the number this job's shape depends
  # on, and the one to re-measure first if any of this stops making sense.
  #
  # THE MATRIX IS DELIBERATELY ASYMMETRIC, and the runner's numbers are why.
  # unix runs all three in one leg (7m25s for the lot) because splitting three
  # fast packages across three runners buys nothing. Windows runs ONE PACKAGE
  # PER LEG because packages are serial within a leg: together they are around
  # half an hour of critical path, split they are as long as the longest, which
  # is synthesize. The split also puts a per-package wall time on the checks
  # list, which is the number anyone tuning this wants next. If synthesize ever
  # gets cheap, collapse this to one Windows leg and match the unix shape.
  #
  # THE HONEST MARGIN UNDER -timeout 40m IS 13 MINUTES, not the twenty the
  # midpoint of that range suggests: take it from the WORST sample seen (1641s),
  # because that is the one that would have tripped a tighter ceiling. Four
  # samples spread 41%, and the two ranges written here before this were each
  # exceeded by the next sample, so treat the figure as variable rather than
  # bounded and re-measure before relying on it.
  #
  # If that margin keeps shrinking, RAISE THE WINDOWS CEILING. This package is
  # bound by per-operation latency and nothing in it hangs — the 40m exists to
  # catch a hang, and a hang does not arrive by creeping five minutes at a time.
  # The thing that would deserve investigation is the shape changing: a sudden
  # step, or the unix legs slowing with it.
  #
  # synthesize and repos have never run in a PR job on ANY platform (race.yml
  # covers them, but only after a merge to dev and without blocking); store ran
  # on ubuntu and macos as part of build-test and moved here.
  slow-tests:
    name: slow-tests (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: ubuntu-latest
            os: ubuntu-latest
            packages: ./internal/synthesize/ ./internal/store/... ./internal/repos/
            timeout: 10m
          - leg: macos-latest
            os: macos-latest
            packages: ./internal/synthesize/ ./internal/store/... ./internal/repos/
            timeout: 10m
          - leg: windows-2025 synthesize
            os: windows-2025
            packages: ./internal/synthesize/
            timeout: 40m
          - leg: windows-2025 store
            os: windows-2025
            packages: ./internal/store/...
            timeout: 40m
          - leg: windows-2025 repos
            os: windows-2025
            packages: ./internal/repos/
            timeout: 40m
    runs-on: ${{ matrix.os }}
    # Deliberately looser than the -timeout below, for the reason race.yml
    # spells out: the go test timeout prints a goroutine dump naming the stuck
    # test, while a job timeout kills the runner and leaves a truncated log.
    # This ceiling exists to stop a wedged runner burning the 6-hour default,
    # never to be the thing that reports a hang.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-toolchain
      # The exports are inert on Windows and harmless there; see the note on
      # the same line in build-test.
      - name: go test ${{ matrix.packages }}
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          CGO_ENABLED=1 go test -timeout ${{ matrix.timeout }} ${{ matrix.packages }}

  # Build + test the Wails v3 desktop app. It lives behind `//go:build desktop`
  # and links the OS-native webview toolkit (Cocoa/WebKit on macOS), so the
  # default build-test job never compiles it. macOS needs no extra GUI dev deps
  # (system frameworks), so it is the cheapest runner to prove the desktop path
  # still compiles and its tagged tests (app/boot/native) pass — without this
  # job the Wails code and its tests rot silently against the alpha Wails API.
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Resolve native lib dir
        run: echo "LIBDIR=$(pwd)/dist/$(go env GOOS)-$(go env GOARCH)/lib" >> "$GITHUB_ENV"
      - name: Fetch native libs
        run: make setup
      # Compile-only check (-o /dev/null): proves the Wails-importing main builds.
      - name: Build desktop app (-tags desktop)
        run: CGO_ENABLED=1 go build -tags desktop -o /dev/null ./tools/desktop
      - name: Desktop tests (-tags desktop)
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          CGO_ENABLED=1 go test -tags desktop ./tools/desktop/...

  # Build + test the desktop-only UI bundle (the Settings dialog), which lives
  # in tools/desktop/ui as its own npm project.
  #
  # It needs a job of its own because nothing else here runs Node at all: the
  # `desktop` job above compiles the Go side against tools/desktop/ui/dist, the
  # already-built output, so a TypeScript error or a failing vitest suite passes
  # straight through CI and first surfaces during `make desktop` at RELEASE
  # time — the worst possible moment to discover it, and the reason this
  # frontend's tests were effectively unrun.
  #
  # ubuntu-latest, not macos: this is a pure Node build with no native or
  # platform dependency, so it belongs on the cheapest runner. `npm run build`
  # is `tsc -b && vite build`, so it is the type check as well as the bundle.
  #
  # Scoped to tools/desktop/ui. web/ had the same gap and gets its own job,
  # web-ui below, rather than being wired in here.
  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (locked)
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Unit tests
        run: npm test

  # Type-check + test the main web UI (web/). Its vitest suite ran in no job
  # until #259, so it gated nothing: it sat at 98 failures on developer
  # machines while every check here was green. Making this ~1700-test suite a
  # merge gate (and, via release-stable's `needs: tests`, a release gate) is a
  # deliberate decision, taken in the PR that closes #259.
  #
  # Two Node legs, and the second one is the point. The 98 failures were Node
  # >= 25's own localStorage global shadowing jsdom's under vitest 4 (see the
  # Storage block in web/src/test-setup.ts); on Node 22 alone the suite was
  # green, so a single leg pinned to 22 like desktop-ui would never have seen
  # them. 26 is the newest Node that developer machines run.
  #
  # `npx tsc -b`, not `tsc --noEmit`: web/tsconfig.json is a solution file with
  # `files: []`, so only build mode checks anything.
  web-ui:
    name: web-ui (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (locked)
        run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Unit tests
        run: npx vitest run

  # In-process EmbeddingGemma inference smoke — the formal cross-platform
  # close-out from PoC #2. Downloads the real model (~600MB) once per OS, so it
  # runs only on dev/master pushes, not every PR, to keep PR CI fast.
  #
  # `github.event_name` in a called workflow is the CALLER's event, so this
  # still skips on pull_request and still runs on a dev/master push — and a
  # release tag is a push, so a release is gated on real inference too. That is
  # the right call for the one build users install without re-reading it.
  embed-smoke:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Resolve native lib dir
        run: echo "LIBDIR=$(pwd)/dist/$(go env GOOS)-$(go env GOARCH)/lib" >> "$GITHUB_ENV"
      - name: Fetch native libs
        run: make setup
      - name: Pre-cache EmbeddingGemma ONNX (fp16) + tokenizer
        run: |
          base=https://huggingface.co/onnx-community/embeddinggemma-300m-ONNX/resolve/main
          dir="$RUNNER_TEMP/models/embeddinggemma"
          mkdir -p "$dir"
          curl -sL "$base/onnx/model_fp16.onnx"      -o "$dir/model_fp16.onnx"
          curl -sL "$base/onnx/model_fp16.onnx_data" -o "$dir/model_fp16.onnx_data"
          curl -sL "$base/tokenizer.json"            -o "$dir/tokenizer.json"
      # Run the WHOLE embeddings package, not a -run subset: with the model
      # pre-cached above (KNOMIT_EMBED_TEST_CACHE), the cache-gated real-inference
      # tests all execute — including batch-vs-single equivalence and the
      # truncation cap — instead of silently skipping. The pure unit tests run
      # too (cheap), so any new embedding test is covered without editing the regex.
      - name: In-process embed smoke (full embeddings suite, real inference)
        env:
          KNOMIT_EMBED_TEST_CACHE: ${{ runner.temp }}/models
        # onnxruntime_go dlopens the path given by ORT_LIB_PATH; with it unset it
        # falls back to a bare "onnxruntime.so"/.dylib that the runner does not
        # have (the file make setup downloads is libonnxruntime.so / .dylib), so
        # initORT fails and every real-inference test errors. Point it at the
        # vendored lib explicitly ($LIBDIR is the absolute per-platform lib dir).
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          if [ "$RUNNER_OS" = "macOS" ]; then
            export ORT_LIB_PATH="$LIBDIR/libonnxruntime.dylib"
          else
            export ORT_LIB_PATH="$LIBDIR/libonnxruntime.so"
          fi
          CGO_ENABLED=1 go test ./internal/embeddings/ -v
