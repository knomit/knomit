name: Tests

# The test suite, factored out as a REUSABLE workflow so the two callers run
# the identical definition rather than two copies that drift:
#
#   ci.yml            — dev/master pushes and PRs
#   release-stable.yml — gates `publish`, so no signed release is ever cut
#                        from a tree that failed here
#
# The gate is why this is a separate file. A release publishes an immutable,
# signed artifact that macOS clients then install themselves, and a tag can
# name any commit — "it was green on master" is a convention, not a guarantee.
# Duplicating the jobs into release-stable.yml would gate on a copy that
# silently stops matching CI the first time either side is edited.
#
# ONE CONSEQUENCE OF THAT, NOW THAT WINDOWS IS HERE: `publish` waits on the
# Windows legs too, including the ~30-minute internal/synthesize one, and a
# Windows-only failure blocks a macOS release. That is the same gate working as
# designed — a tree that fails on a platform we support is not a tree to cut a
# signed release from — but it is a new cost, and decoupling it would mean an
# input on this workflow rather than a second copy of these jobs.
#
# Cross-platform build + test. The pluggable embedder links daulet/tokenizers'
# libtokenizers.a statically (CGo) and loads ONNX Runtime at
# runtime, so this matrix proves the native-lib wiring resolves on each OS.
#
# WINDOWS IS IN THE MATRIX, and it is here for a specific failure. The memguard
# fail-open bug (shipped in #211, fixed in #212) matched forward-slash paths
# only, so on Windows the guard allowed every write it exists to deny — and
# nothing anywhere went red, because no CI job ran this suite on Windows. It
# was found by a person running the tests by hand. A platform nobody's CI runs
# is a platform whose bugs are silent, and that is the whole argument for the
# cost of the legs below.
#
# WINDOWS-2025, NOT WINDOWS-LATEST. This leg exists to catch OUR regressions,
# not the image's migrations. `windows-latest` is a moving alias — GitHub
# migrates it gradually over a month or two — and on Windows the toolchain is
# the IMAGE's, not ours: the compiler, the Rust target and the C runtime all
# come from it. A silent migration would therefore change what this leg tests
# on a day nobody touched this file. The facts the Windows leg relies on, all
# from image 20260907.x (Server 2025), are:
#   - mingw-w64 gcc 15.2.0 on the machine PATH at C:\mingw64\bin, plus a
#     make.exe in the same directory — so the CGo toolchain and `make setup`
#     need no install step. NOTE it is a UCRT build while the Rust GNU target
#     is MSVCRT-flavoured; see the action for what to do if that ever bites.
#   - Rust 1.98.1 with x86_64-pc-windows-gnu already added at image build time.
#     The explicit `rustup target add` in the action is a drift guard, not a
#     requirement the image fails to meet.
#   - VC++ 2015-2022 runtime 14.51.36247, well above the >= 14.40 that
#     onnxruntime >= 1.21 needs, so ortinit_windows.go's annotation path is
#     unreachable here. The action prints the installed version every run,
#     because an image rollback is the one way this paragraph goes quietly
#     wrong.
# When the pin is eventually retired, re-read those four facts before moving to
# the next one.
#
# WHAT THE RUNNER DOES NOT GIVE US, and this file supplies:
#   - A cache for dist/windows-amd64/lib. daulet/tokenizers publishes no
#     Windows artifact (darwin/linux only through v1.27.0), so fetchlibs BUILDS
#     libtokenizers.a from source there — clone the pinned tag, run cargo, ~5
#     minutes — before a single test executes. See .github/actions/
#     native-toolchain, which also explains why the key has no restore-keys.
#   - `-timeout 40m` on the slow-tests legs. On Windows internal/synthesize
#     (1776s) and internal/store (816s) exceed go test's 10-minute per-package
#     default outright, and internal/repos (441-639s across runs) straddles it.
#     Nothing hangs; all three are filesystem cost, and the Makefile scopes the
#     same 40m to GOOS=windows for the same reason. Every OTHER step keeps the
#     10-minute default deliberately: a ceiling is also a hang guard, and a
#     package that suddenly needs 40 minutes is news.
#
# THE RUNNER IS ELEVATED, and that is not a choice we have. GitHub-hosted
# Windows runners run as administrator with UAC disabled, so the process holds
# SeCreateSymbolicLinkPrivilege and the canSymlink() probes in
# internal/repos/origin_test.go and tools/desktop/bundled_test.go come back
# TRUE. Two consequences, both of them what IS rather than what we would like:
# the symlink-escape security test really does execute here (one of the reasons
# ./internal/repos/ is worth running on this leg at all), and the UNPRIVILEGED
# branch — the skip path an ordinary Windows user actually takes — is exercised
# by no CI leg on any platform and remains local-verification-only.
on:
  workflow_call:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    # bash on every platform, stated once. GitHub's default shell on Windows is
    # pwsh, so without this line every `run:` below would need its own `shell:`
    # or would be read by a shell that does not know what $LIBDIR or `export`
    # are. One shell across the matrix is also what keeps the steps themselves
    # platform-neutral.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # setup-go, the Windows CGo toolchain checks, the native-lib cache and
      # `make setup`. Shared with slow-tests; see the action for the Windows
      # specifics.
      - uses: ./.github/actions/native-toolchain

      # Build every package that has buildable (non-test) Go files in the
      # default (no -tags) configuration. `{{if .GoFiles}}` drops test-only
      # packages (e.g. test/storytests); `go build` treats an
      # explicitly-listed test-only package as a fatal error, so they must not
      # appear in the argument list. The Wails desktop app under tools/desktop
      # is excluded automatically — all its files are behind `//go:build
      # desktop`, so without the tag the package has no GoFiles — which means
      # this step also proves the cloud build stays Wails-free. The desktop app
      # is built + tested separately in the `desktop` job below.
      - name: Build (CGo) — proves libtokenizers.a links + cloud is Wails-free
        run: CGO_ENABLED=1 go build $(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./...)

      - name: Unit tests (no model download)
        run: CGO_ENABLED=1 go test ./internal/embeddings/ ./internal/config/ ./internal/fact/

      # Guard: the test harness (test/testenv, test/storytests) must
      # never be linked into a shipped binary. Pure `go list` graph check, no
      # native libs / no compile.
      - name: Test-harness isolation guard
        run: go test ./test/archtest/

      # These link the runtime native libs: internal/web transitively (it
      # constructs a store in tests), and the desktop helper packages
      # (lockfile/netutil/paths/autostart/singleinstance) are plain Go but run
      # here too so the build-test job actually exercises them. The desktop
      # `//go:build desktop` packages are covered by the `desktop` job below.
      #
      # internal/store itself moved to the slow-tests job — 816s on Windows,
      # past go test's per-package default. It is the only package that moved.
      #
      # The two exports are INERT ON WINDOWS and are left unguarded on purpose:
      # there the loader searches PATH, not LD_LIBRARY_PATH/DYLD_LIBRARY_PATH.
      # Nothing in the default suite loads onnxruntime.dll on any platform — a
      # test binary never sits next to dist/<platform>/lib, so libCandidates()
      # misses everywhere and the real-inference tests are cache-gated to
      # embed-smoke — so this is a no-op, not a gap. If a test here ever does
      # need ORT on Windows, the spelling is ORT_LIB_PATH="$LIBDIR/onnxruntime.dll"
      # (no lib prefix on the filename; see tools/fetchlibs/spec.go ortSpec).
      - name: Story, web + desktop-helper tests (runtime native libs)
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          CGO_ENABLED=1 go test ./test/storytests/ ./internal/web/... ./tools/desktop/internal/...

      # NEW WITH THE WINDOWS LEG, AND HALF THE POINT OF IT. These packages were
      # COMPILED by the build step above but their tests ran on no platform in
      # any PR job — tools/bridge on no platform at all. That is where the
      # memguard fail-open bug lived: a guard that silently permitted every
      # write it exists to deny, in a package CI never executed. cmd, too,
      # covers the server's entry points, and internal/platform holds fileuri,
      # the path-spelling helper #212 introduced.
      #
      # They are here rather than in slow-tests because they are cheap even on
      # the slow platform: 93s for all of them on Windows, of which cmd is 57s.
      - name: Bridge, platform + cmd tests
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          CGO_ENABLED=1 go test ./tools/bridge/... ./internal/platform/... ./cmd/

      # Origin-sync fault matrix: build-tagged contract cells drive the real
      # product clone/sync/push path over an in-process fault-injecting git
      # server (stalls, expired tokens, wrong default branch, re-point). They
      # are behind `//go:build contract` so they stay out of the default suite;
      # this step is what actually gates them. Each cell asserts a graceful
      # contract (bounded by timeout, typed/visible error, no silent success).
      - name: Origin-sync contract cells (fault matrix)
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          CGO_ENABLED=1 go test -tags contract ./test/storytests/ -count=1 -timeout 300s

  # The three packages that are slow ON WINDOWS ONLY, in their own job so the
  # build-test leg stays a fast answer to "did this break the build". Measured
  # on windows/amd64: internal/synthesize 1776s, internal/store 816s,
  # internal/repos 441-639s. On ubuntu and macos the same three are minutes in
  # total — the cost is filesystem, not computation, and nothing hangs (see the
  # Makefile's GOTEST_TIMEOUT comment, which scopes the same 40m to
  # GOOS=windows).
  #
  # THE MATRIX IS DELIBERATELY ASYMMETRIC. unix runs all three in one leg
  # because splitting three fast packages across three runners would buy
  # nothing; Windows runs one package per leg because they are serial within a
  # leg, so together they are ~50 minutes of critical path and separately they
  # are as long as the longest. It also puts a per-package wall time on the
  # checks list, which is the number anyone tuning this will want next.
  #
  # synthesize and repos have never run in a PR job on ANY platform (race.yml
  # covers them, but only after a merge to dev and without blocking); store ran
  # on ubuntu and macos as part of build-test and moved here.
  slow-tests:
    name: slow-tests (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: ubuntu-latest
            os: ubuntu-latest
            packages: ./internal/synthesize/ ./internal/store/... ./internal/repos/
            timeout: 10m
          - leg: macos-latest
            os: macos-latest
            packages: ./internal/synthesize/ ./internal/store/... ./internal/repos/
            timeout: 10m
          - leg: windows-2025 synthesize
            os: windows-2025
            packages: ./internal/synthesize/
            timeout: 40m
          - leg: windows-2025 store
            os: windows-2025
            packages: ./internal/store/...
            timeout: 40m
          - leg: windows-2025 repos
            os: windows-2025
            packages: ./internal/repos/
            timeout: 40m
    runs-on: ${{ matrix.os }}
    # Deliberately looser than the -timeout below, for the reason race.yml
    # spells out: the go test timeout prints a goroutine dump naming the stuck
    # test, while a job timeout kills the runner and leaves a truncated log.
    # This ceiling exists to stop a wedged runner burning the 6-hour default,
    # never to be the thing that reports a hang.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-toolchain
      # The exports are inert on Windows and harmless there; see the note on
      # the same line in build-test.
      - name: go test ${{ matrix.packages }}
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          CGO_ENABLED=1 go test -timeout ${{ matrix.timeout }} ${{ matrix.packages }}

  # Build + test the Wails v3 desktop app. It lives behind `//go:build desktop`
  # and links the OS-native webview toolkit (Cocoa/WebKit on macOS), so the
  # default build-test job never compiles it. macOS needs no extra GUI dev deps
  # (system frameworks), so it is the cheapest runner to prove the desktop path
  # still compiles and its tagged tests (app/boot/native) pass — without this
  # job the Wails code and its tests rot silently against the alpha Wails API.
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Resolve native lib dir
        run: echo "LIBDIR=$(pwd)/dist/$(go env GOOS)-$(go env GOARCH)/lib" >> "$GITHUB_ENV"
      - name: Fetch native libs
        run: make setup
      # Compile-only check (-o /dev/null): proves the Wails-importing main builds.
      - name: Build desktop app (-tags desktop)
        run: CGO_ENABLED=1 go build -tags desktop -o /dev/null ./tools/desktop
      - name: Desktop tests (-tags desktop)
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          CGO_ENABLED=1 go test -tags desktop ./tools/desktop/...

  # Build + test the desktop-only UI bundle (the Settings dialog), which lives
  # in tools/desktop/ui as its own npm project.
  #
  # It needs a job of its own because nothing else here runs Node at all: the
  # `desktop` job above compiles the Go side against tools/desktop/ui/dist, the
  # already-built output, so a TypeScript error or a failing vitest suite passes
  # straight through CI and first surfaces during `make desktop` at RELEASE
  # time — the worst possible moment to discover it, and the reason this
  # frontend's tests were effectively unrun.
  #
  # ubuntu-latest, not macos: this is a pure Node build with no native or
  # platform dependency, so it belongs on the cheapest runner. `npm run build`
  # is `tsc -b && vite build`, so it is the type check as well as the bundle.
  #
  # Scoped deliberately to tools/desktop/ui. web/ has the same gap and is a
  # separate decision — wiring it in here would silently make a much larger
  # suite a merge gate.
  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (locked)
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Unit tests
        run: npm test

  # In-process EmbeddingGemma inference smoke — the formal cross-platform
  # close-out from PoC #2. Downloads the real model (~600MB) once per OS, so it
  # runs only on dev/master pushes, not every PR, to keep PR CI fast.
  #
  # `github.event_name` in a called workflow is the CALLER's event, so this
  # still skips on pull_request and still runs on a dev/master push — and a
  # release tag is a push, so a release is gated on real inference too. That is
  # the right call for the one build users install without re-reading it.
  embed-smoke:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Resolve native lib dir
        run: echo "LIBDIR=$(pwd)/dist/$(go env GOOS)-$(go env GOARCH)/lib" >> "$GITHUB_ENV"
      - name: Fetch native libs
        run: make setup
      - name: Pre-cache EmbeddingGemma ONNX (fp16) + tokenizer
        run: |
          base=https://huggingface.co/onnx-community/embeddinggemma-300m-ONNX/resolve/main
          dir="$RUNNER_TEMP/models/embeddinggemma"
          mkdir -p "$dir"
          curl -sL "$base/onnx/model_fp16.onnx"      -o "$dir/model_fp16.onnx"
          curl -sL "$base/onnx/model_fp16.onnx_data" -o "$dir/model_fp16.onnx_data"
          curl -sL "$base/tokenizer.json"            -o "$dir/tokenizer.json"
      # Run the WHOLE embeddings package, not a -run subset: with the model
      # pre-cached above (KNOMIT_EMBED_TEST_CACHE), the cache-gated real-inference
      # tests all execute — including batch-vs-single equivalence and the
      # truncation cap — instead of silently skipping. The pure unit tests run
      # too (cheap), so any new embedding test is covered without editing the regex.
      - name: In-process embed smoke (full embeddings suite, real inference)
        env:
          KNOMIT_EMBED_TEST_CACHE: ${{ runner.temp }}/models
        # onnxruntime_go dlopens the path given by ORT_LIB_PATH; with it unset it
        # falls back to a bare "onnxruntime.so"/.dylib that the runner does not
        # have (the file make setup downloads is libonnxruntime.so / .dylib), so
        # initORT fails and every real-inference test errors. Point it at the
        # vendored lib explicitly ($LIBDIR is the absolute per-platform lib dir).
        run: |
          export LD_LIBRARY_PATH="$LIBDIR" DYLD_LIBRARY_PATH="$LIBDIR"
          if [ "$RUNNER_OS" = "macOS" ]; then
            export ORT_LIB_PATH="$LIBDIR/libonnxruntime.dylib"
          else
            export ORT_LIB_PATH="$LIBDIR/libonnxruntime.so"
          fi
          CGO_ENABLED=1 go test ./internal/embeddings/ -v
