name: Release (dev)

# Manual dev builds. Dispatch selecting the `dev` branch:
#   Actions → "Release (dev)" → Run workflow → Branch: dev
#   (or: gh workflow run release.yml --ref dev)
#
# IMPORTANT: workflow_dispatch is only OFFERED when this file exists on the
# repository's DEFAULT branch (master). Selecting `dev` at dispatch time then
# runs this workflow + the Makefile FROM `dev` and checks out `dev`'s tree — so
# the file must live on both `master` (to expose the trigger) and `dev` (what
# actually builds). See .claude/plans/2026-07-19-dev-release-pipeline-design.md.
#
# Wails cannot cross-compile (CGO + OS-native webview), so each desktop platform
# builds on its own native runner: macOS (arm64) and Linux (amd64). The server
# tarballs, the macOS .app zip, the Linux .AppImage and a GHCR Docker image all
# land in a single ROLLING pre-release
# tagged `dev-latest`, replaced on every run. (The git tag is `dev-latest`, not
# `dev`, so it never collides with the `dev` branch — a bare `dev` ref would be
# ambiguous to git and would silently no-op a `git pull origin dev`.)

on:
  workflow_dispatch:

# Only one dev release build at a time; a newer dispatch supersedes an older one
# so they never race on the shared `dev-latest` release/tag.
concurrency:
  group: release-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS (arm64)
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch native libs (ONNX Runtime, libtokenizers.a)
        run: make setup
      # Same signing path as release-stable.yml, deliberately: dev is the build
      # we install most often, so it is where an unsigned bundle costs the most.
      # See that workflow for why the keychain is a throwaway and why
      # set-key-partition-list and the prepended search list are both required.
      #
      # The guards below are hard failures rather than a fall-through to ad-hoc,
      # matching stable. A dev release that cannot be signed is one to fix, not
      # one to ship under install notes that promise a notarized app.
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ]; then
            echo "::error::secrets.MACOS_CERT_P12 is unset"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          security find-identity -v -p codesigning "$keychain" \
            | grep -q "$CODESIGN_IDENTITY" \
            || { echo "::error::no '$CODESIGN_IDENTITY' identity in the imported keychain"; exit 1; }
      - name: Stage notarization API key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$NOTARY_KEY_P8" ]; then
            echo "::error::secrets.NOTARY_KEY_P8 is unset"
            exit 1
          fi
          umask 077
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
      - name: Package server tarball + desktop .app zip
        env:
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$CODESIGN_IDENTITY" ]; then
            echo "::error::vars.CODESIGN_IDENTITY is unset — this build would be ad-hoc signed"
            exit 1
          fi
          # Blocks in desktop-notarize on Apple's queue (minutes, not seconds).
          make release
      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest # x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # GTK4 + WebKitGTK 6.0 + libsoup3 dev stack the Wails desktop build links.
      - name: Install desktop build deps
        run: make desktop-deps
      # appimagetool packages the Linux desktop app as a single .AppImage.
      # The statically linked runtime it embeds still needs kernel FUSE and
      # fusermount3 on the END USER's machine; --appimage-extract-and-run below
      # is only about appimagetool itself self-mounting on this runner.
      - name: Install appimagetool
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Fetch native libs
        run: make setup
      - name: Package server tarball + desktop AppImage
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Build + push Docker image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/<repo>
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: echo "full=$(make -s print-version)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile is self-contained: it fetches native libs and bakes the
      # embedding model at build time (knomit warm-models), so the pushed image
      # needs no startup downloads. amd64 only for now (matches the Linux tarballs).
      - name: Build + push
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          FULL: ${{ steps.ver.outputs.full }}
        run: |
          docker build -t "$IMAGE:dev" -t "$IMAGE:$FULL" .
          docker push "$IMAGE:dev"
          docker push "$IMAGE:$FULL"

  publish:
    name: Publish rolling dev pre-release
    runs-on: ubuntu-latest
    needs: [macos, linux, docker]
    permissions:
      contents: write # create the GitHub release + move the `dev-latest` tag
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Full history + tags: the changelog below diffs this commit against the
      # commit the previous `dev-latest` release was cut from, which a shallow
      # clone cannot reach.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts # → artifacts/<job-name>/<file>
      # `full` (semver.sha) names the release and is what the binaries report;
      # `semver` is what the ARTIFACT FILENAMES carry — see the release
      # packaging block in the Makefile. Keeping both explicit here stops the
      # notes from advertising downloads that do not exist.
      - name: Resolve version
        id: ver
        run: |
          echo "full=$(make -s print-version)" >> "$GITHUB_OUTPUT"
          echo "semver=$(make -s print-semver)" >> "$GITHUB_OUTPUT"
      # MUST run before the release is deleted below — that deletion takes the
      # `dev-latest` tag with it, and the tag is what marks the previous build.
      - name: Collect changes since the previous dev release
        run: |
          set -euo pipefail
          prev="$(git rev-parse -q --verify "refs/tags/dev-latest^{commit}" || true)"
          if [ -z "$prev" ]; then
            # Tag missing locally (first ever run, or it was deleted by hand):
            # ask the API what commit the existing release points at.
            prev="$(gh release view dev-latest --json targetCommitish \
                      -q .targetCommitish 2>/dev/null || true)"
            prev="$(git rev-parse -q --verify "${prev}^{commit}" 2>/dev/null || true)"
          fi

          {
            echo "## Changes"
            echo
            if [ -z "$prev" ]; then
              echo "_No previous \`dev-latest\` release to compare against._"
            elif [ "$prev" = "$GITHUB_SHA" ]; then
              echo "_No new commits since the previous \`dev-latest\` release._"
            else
              # --no-merges: merge commits add no information here, their
              # constituent commits are already listed.
              git log --no-merges --reverse \
                --pretty=format:'- %s (`%h`)' "$prev..$GITHUB_SHA"
              echo
              echo
              echo "[Full diff](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_SHA})"
            fi
          } > changelog.md
      # Filenames use $SEMVER, the identity line uses $FULL. The artifacts are
      # named from the Makefile's VERSION alone (no SHA), so interpolating
      # $FULL into a download name here would advertise files that do not
      # exist — which is exactly what it used to do.
      - name: Write release notes
        env:
          FULL: ${{ steps.ver.outputs.full }}
          SEMVER: ${{ steps.ver.outputs.semver }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Rolling development build from \`dev\` — **$FULL** (\`$GITHUB_SHA\`).

          This pre-release is replaced on every run; the download URLs are
          stable. The assets are named \`$SEMVER\` without a SHA, so each run
          overwrites the previous one — the build they actually came from is
          the \`$FULL\` above, and every binary reports it (\`knomit version\`).

          $(cat changelog.md)

          ## Downloads

          | Platform | Server | Desktop |
          |----------|--------|---------|
          | macOS (Apple Silicon) | \`knomit-$SEMVER-darwin-arm64.tar.gz\` | \`Knomit-$SEMVER-darwin-arm64.app.zip\` |
          | Linux (x86_64) | \`knomit-$SEMVER-linux-amd64.tar.gz\` | \`Knomit-$SEMVER-linux-amd64.AppImage\` |

          ## Install

          **macOS desktop:** signed with Developer ID and notarized by Apple —
          unzip and open it, no quarantine step needed. The ticket is stapled
          into the bundle, so the first launch works offline too.

          **Server (macOS/Linux):** extract and run — native libs resolve from the
          bundled \`lib/\` automatically. The embedding model (~600 MB) downloads on
          first run.
          \`\`\`sh
          tar xzf knomit-$SEMVER-<platform>.tar.gz && cd knomit-$SEMVER-<platform>
          ./knomit serve
          \`\`\`

          **Linux desktop:** a single AppImage. Requires GTK 4 + WebKitGTK 6.0
          runtime libraries on the host; everything else travels inside.
          \`\`\`sh
          chmod +x Knomit-$SEMVER-linux-amd64.AppImage
          ./Knomit-$SEMVER-linux-amd64.AppImage
          \`\`\`
          Desktop-menu integration is handled by the AppImage itself — no
          install script. On a host without FUSE, prefix the command with
          \`APPIMAGE_EXTRACT_AND_RUN=1\`.

          **Docker:**
          \`\`\`sh
          docker run -p 19278:19278 -v knomit-data:/data $IMAGE:dev
          \`\`\`
          Use a named volume (not a host bind-mount) for \`/data\` so the baked model is preserved.
          EOF
      - name: Recreate the rolling `dev-latest` pre-release
        env:
          FULL: ${{ steps.ver.outputs.full }}
        run: |
          # Remove the previous release AND its tag so the new one points at this
          # commit. Delete a stray tag too (belt-and-suspenders: gh release create
          # on a pre-existing tag would ignore --target and keep the old commit).
          gh release delete dev-latest --yes --cleanup-tag 2>/dev/null || true
          git push origin --delete dev-latest 2>/dev/null || true
          gh release create dev-latest \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "dev-latest ($FULL)" \
            --notes-file notes.md \
            artifacts/*/*
