name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

# Cross-platform build + test. The pluggable embedder links daulet/tokenizers'
# libtokenizers.a statically (CGo) and loads ONNX Runtime + graphqlite at
# runtime, so this matrix proves the native-lib wiring resolves on each OS.
#
# Windows is intentionally NOT in the matrix yet. Native-lib fetching is now
# cross-platform (`go run ./tools/fetchlibs` replaced the bash scripts and runs
# on windows-latest), and ONNX Runtime + graphqlite both publish Windows assets.
# The remaining blocker is upstream: daulet/tokenizers ships NO Windows artifact
# (darwin/linux only through v1.27.0), and internal/embeddings statically links
# libtokenizers.a, so a Windows build needs an upstream/from-source .a plus an
# MSYS2/mingw CGo toolchain on the runner. That is the follow-up, not the fetch.
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Fetch native libs (ONNX Runtime, graphqlite, libtokenizers.a)
        run: make setup

      # Build every package that has buildable (non-test) Go files, EXCEPT
      # tools/tray. Two filters:
      #   - `{{if .GoFiles}}` drops test-only packages (e.g. internal/storytests);
      #     `go build` treats an explicitly-listed test-only package as a fatal
      #     error, so they must not appear in the argument list.
      #   - grep -v '/tools/tray' drops the desktop GUI binary, which links
      #     GTK + WebKit (webview_go / fyne systray) and needs its own platform
      #     build path (Makefile `tray` target + webkit2gtk pkg-config shim).
      #     A dedicated tray CI job with the GUI dev libs is a follow-up.
      - name: Build (CGo) — proves libtokenizers.a links on ${{ matrix.os }}
        run: CGO_ENABLED=1 go build $(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '/tools/tray')

      - name: Unit tests (no model download)
        run: CGO_ENABLED=1 go test ./internal/embeddings/ ./internal/config/ ./internal/fact/

      - name: Store + storytests (runtime native libs)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/dist/lib
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/dist/lib
        run: CGO_ENABLED=1 go test ./internal/store/... ./internal/storytests/

  # In-process EmbeddingGemma inference smoke — the formal cross-platform
  # close-out from PoC #2. Downloads the real model (~600MB) once per OS, so it
  # runs only on dev/master pushes, not every PR, to keep PR CI fast.
  embed-smoke:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Fetch native libs
        run: make setup
      - name: Pre-cache EmbeddingGemma ONNX (fp16) + tokenizer
        run: |
          base=https://huggingface.co/onnx-community/embeddinggemma-300m-ONNX/resolve/main
          dir="$RUNNER_TEMP/models/embeddinggemma"
          mkdir -p "$dir"
          curl -sL "$base/onnx/model_fp16.onnx"      -o "$dir/model_fp16.onnx"
          curl -sL "$base/onnx/model_fp16.onnx_data" -o "$dir/model_fp16.onnx_data"
          curl -sL "$base/tokenizer.json"            -o "$dir/tokenizer.json"
      # Run the WHOLE embeddings package, not a -run subset: with the model
      # pre-cached above (KNOMIT_EMBED_TEST_CACHE), the cache-gated real-inference
      # tests all execute — including batch-vs-single equivalence and the
      # truncation cap — instead of silently skipping. The pure unit tests run
      # too (cheap), so any new embedding test is covered without editing the regex.
      - name: In-process embed smoke (full embeddings suite, real inference)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/dist/lib
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/dist/lib
          KNOMIT_EMBED_TEST_CACHE: ${{ runner.temp }}/models
        # onnxruntime_go dlopens the path given by ORT_LIB_PATH; with it unset it
        # falls back to a bare "onnxruntime.so"/.dylib that the runner does not
        # have (the file make setup downloads is libonnxruntime.so / .dylib), so
        # initORT fails and every real-inference test errors. Point it at the
        # vendored lib explicitly. `go test` runs from the package dir, so the
        # path must be absolute (GITHUB_WORKSPACE), not relative to dist/lib.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export ORT_LIB_PATH="$GITHUB_WORKSPACE/dist/lib/libonnxruntime.dylib"
          else
            export ORT_LIB_PATH="$GITHUB_WORKSPACE/dist/lib/libonnxruntime.so"
          fi
          CGO_ENABLED=1 go test ./internal/embeddings/ -v
