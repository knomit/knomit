name: Native toolchain + libs
description: >
  Go, a verified CGo toolchain, and the native libraries every knomit build
  links (libtokenizers.a) or loads (ONNX Runtime).

# WHY THIS IS A COMPOSITE ACTION RATHER THAN COPIED STEPS. Every platform gets
# the native-lib restore/save pair and a resolved lib dir; WINDOWS additionally
# gets a toolchain probe, an sqlite3 header, a Rust target and a path-spelling
# conversion. Two jobs in tests.yml need all of it (build-test and slow-tests),
# and a second copy is a copy that stops matching the first one the day either
# is edited — the same argument the tests.yml header makes for being a reusable
# workflow instead of a duplicate of its jobs.
#
# The macOS-only jobs (desktop, embed-smoke) keep their inline steps: they run
# neither the Windows half nor the cache, so folding them in here would trade
# three readable lines for an indirection that buys them nothing. They still
# download both libs on every run; that is a known, deliberate gap, not an
# oversight — they are two jobs, not the matrix.

inputs:
  go-version:
    description: Go toolchain version, passed to actions/setup-go.
    required: false
    default: '1.26'

runs:
  using: composite
  steps:
    # The image's tool cache already holds Go 1.26.x, so this resolves without
    # a download. Its default module/build cache (keyed on go.sum) is separate
    # from the native-lib cache below and is left alone.
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}

    # ---------------------------------------------------------------- Windows
    # Everything from here to the "native libs" banner is Windows-only. ubuntu
    # and macos ship a working C toolchain and download a published
    # libtokenizers.a; windows has neither — daulet/tokenizers publishes no
    # windows asset through v1.27.0, so fetchlibs builds it with cargo.

    # A PROBE, NOT AN INSTALL. The windows-2025 image (20260907.x) already puts
    # mingw-w64 gcc 15.2.0 on the MACHINE PATH from C:\mingw64\bin
    # — Install-Mingw64.ps1 ends in Add-MachinePathItem — and copies
    # mingw32-make.exe to make.exe in the same directory, so `make` is there
    # too. So there is nothing to set up, only something to verify and record.
    #
    # DELIBERATELY NOT msys2/setup-msys2. MSYS2 is preinstalled at C:\msys64
    # but is NOT on PATH and carries NO mingw gcc (toolset-2025.json's
    # MsysPackages.mingw is empty), so using it means pacman-installing a
    # compiler — a download, a second bash with its own PATH and its own path
    # spellings, and the `shell: msys2 {0}` split across steps. Mixing two
    # shells' path spellings is exactly the failure class PR #212 spent a week
    # on. It stays the documented fallback for the CRT mismatch below, not the
    # default.
    #
    # KNOWN, UNVERIFIED MISMATCH — read this first if the CGo build breaks.
    # The image's gcc is a UCRT build (toolset-2025.json pins
    # {"version": "15.*", "runtime": "ucrt"}); Rust's x86_64-pc-windows-gnu,
    # which spec.go pins for libtokenizers.a, is the MSVCRT-flavoured mingw
    # target, and the machine that verified #212 by hand used MSYS2's MSVCRT
    # gcc 16.2. Linking an MSVCRT-flavoured Rust staticlib with a UCRT gcc is a
    # combination nobody has run. If the CGo build step reports undefined or
    # duplicate CRT symbols, that is the cause; the fix is msys2/setup-msys2
    # with mingw-w64-x86_64-gcc (MSVCRT, matching the known-good local box).
    #
    # The diagnostics are printed on every run, not just the first: on Windows
    # they are the difference between reading a cause and bisecting for one.
    # core.autocrlf especially — the repo has no .gitattributes, so if a future
    # image flips it, golden-file comparisons start failing for a reason that
    # has nothing to do with the code under test.
    - name: Verify Windows CGo toolchain
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -uo pipefail
        if ! command -v gcc >/dev/null; then
          echo "::error::no gcc on PATH; knomit's CGo build needs a mingw-w64 toolchain"
          echo "windows-2025 ships one at C:\\mingw64\\bin on the machine PATH." >&2
          echo "If the image dropped it, add msys2/setup-msys2 with" >&2
          echo "install: mingw-w64-x86_64-gcc and run the CGo steps in that shell." >&2
          exit 1
        fi
        echo "gcc:      $(command -v gcc)"
        gcc --version | head -1
        gcc -dumpmachine
        echo "make:     $(command -v make || echo '(none)')"
        echo "rustup:   $(command -v rustup || echo '(none)')"
        rustup show active-toolchain 2>/dev/null || true
        echo "autocrlf: $(git config --get core.autocrlf || echo '(unset)')"

    # sqlite3.h — the Windows build requirement nobody had written down, found
    # by this job's first run.
    #
    # github.com/asg017/sqlite-vec-go-bindings/cgo does `#include "sqlite3.h"`
    # and carries no header of its own. ubuntu resolves that from
    # libsqlite3-dev, macos from the SDK, and the machine that verified #212 by
    # hand resolved it from MSYS2's mingw-w64-x86_64-sqlite3 package — which no
    # Makefile, doc or source comment in this repo mentions. C:\mingw64, the
    # image's toolchain, ships no sqlite3.h at all, so the very first Windows
    # CI build died on a missing header. That is this PR's own argument landing
    # on this PR: a requirement that lives only on one developer's machine is a
    # requirement nobody can reproduce.
    #
    # The header ONLY. mattn/go-sqlite3's vendored amalgamation is still what
    # provides the implementation, on Windows exactly as on the other two — the
    # split between a system header and a vendored implementation is the
    # existing arrangement, not something introduced here, and nothing links
    # against MSYS2's libsqlite3.
    #
    # CGO_CPPFLAGS rather than CGO_CFLAGS: CFLAGS has a meaningful default
    # (-O2 -g) that setting it here would silently drop. CPPFLAGS is empty by
    # default and reaches every cgo compile.
    #
    # THE HEADER IS COPIED OUT rather than the MSYS2 include directory being
    # put on the search path. -IC:/msys64/mingw64/include would add an entire
    # second mingw sysroot — zlib.h, iconv.h, the openssl tree, hundreds more —
    # to every cgo compile in the build, and it belongs to a DIFFERENT mingw
    # distribution than the compiler in use (MSYS2's is MSVCRT-flavoured, the
    # image's C:\mingw64 is UCRT). That is the header form of the rule this
    # action applies to shells: never two of the same thing on one path. With
    # one header in the directory, an #include that is not sqlite3.h fails
    # loudly here instead of quietly resolving against the other sysroot.
    #
    # Invoked through MSYS2's own login bash rather than calling pacman.exe
    # from this one: two MSYS runtimes on one PATH is the kind of mixing this
    # action avoids everywhere else. `-Sy` without `-u` is pacman's documented
    # partial-upgrade hazard and is deliberate here: this is a throwaway runner
    # and MSYS2 is a header source that never reaches PATH, so syncing the
    # package database without committing to a full system upgrade is the
    # cheaper half of the trade. The existence check and --needed make the step
    # idempotent.
    - name: sqlite3 development header (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        hdr=/c/msys64/mingw64/include/sqlite3.h
        if [ ! -f "$hdr" ]; then
          C:/msys64/usr/bin/bash -lc \
            'pacman -Sy --noconfirm --needed mingw-w64-x86_64-sqlite3'
        fi
        if [ ! -f "$hdr" ]; then
          echo "::error::sqlite3.h is still missing after installing mingw-w64-x86_64-sqlite3"
          echo "sqlite-vec-go-bindings/cgo includes it and ships no copy. If MSYS2 moved," >&2
          echo "the alternatives are the sqlite.org amalgamation header or a toolchain that" >&2
          echo "bundles one." >&2
          exit 1
        fi
        grep -m1 '#define SQLITE_VERSION ' "$hdr" || true
        # RUNNER_TEMP is a WINDOWS path (D:\a\_temp), and bash reads its
        # backslashes as escapes, so it is converted before mkdir/cp touch it
        # and converted back for the compiler flag. Naming both conversions is
        # the same discipline LIBDIR gets below.
        inc="$(cygpath -u "$RUNNER_TEMP")/sqlite-include"
        mkdir -p "$inc"
        cp "$hdr" "$inc/"
        echo "CGO_CPPFLAGS=-I$(cygpath -m "$inc")" >> "$GITHUB_ENV"

    # Informational, and deliberately NOT a failure. onnxruntime >= 1.21 needs
    # the VC++ 2015-2022 runtime >= 14.40, or its DLL refuses to initialise
    # with nothing but "a dynamic link library (DLL) initialization routine
    # failed" (internal/embeddings/ortinit_windows.go turns that into an
    # actionable message). The image ships 14.51.36247, comfortably above the
    # floor, and no step in tests.yml LOADS onnxruntime.dll on Windows today
    # anyway — embed-smoke, the job that runs real inference, is ubuntu and
    # macos. So a runtime below the floor would break nothing here and going
    # red over it would be a red build for a hypothetical. It is PRINTED
    # because that is the one fact in this file that could regress silently: an
    # image rollback would leave the comment above stating a version the runner
    # no longer has, and this line would say so in every log.
    #
    # pwsh, not bash: a file's version resource is a Windows API call.
    - name: VC++ runtime version (informational)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $dll = Join-Path $env:SystemRoot 'System32\msvcp140.dll'
        if (-not (Test-Path $dll)) {
          Write-Host 'msvcp140.dll not found: the VC++ 2015-2022 redistributable is not installed.'
          exit 0
        }
        $v = (Get-Item $dll).VersionInfo
        $ok = ($v.FileMajorPart -gt 14) -or ($v.FileMajorPart -eq 14 -and $v.FileMinorPart -ge 40)
        $verdict = if ($ok) { 'OK' } else { 'TOO OLD' }
        Write-Host "msvcp140.dll $($v.FileVersion) - onnxruntime >= 1.21 needs >= 14.40: $verdict"

    # WINDOWS-ONLY, AND IT STAYS THAT WAY. What this step produces that the
    # cache key needs is the Rust target triple, and there is no Rust on ubuntu
    # or macos — they download a published libtokenizers.a. So the unix key
    # does not carry a triple and does not need this step; see the key's own
    # comment under "Restore native libs".
    #
    # The triple is named explicitly in the Windows key (via
    # NATIVE_LIBS_SLUG, assembled in "Resolve native lib dir" below). It is
    # redundant with the hashFiles('tools/fetchlibs/spec.go') component and it
    # is the one component whose staleness would be invisible: an MSVC-target
    # .lib and a GNU-target .a are both called libtokenizers.a, and only one of
    # them links against mingw's ld. This step reads it out of the source (the
    # rustup step below uses it too) and fails loudly if the constant is ever
    # renamed, rather than letting the key quietly lose a component.
    - name: Read pinned native-lib versions
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        read_const() {
          grep -oE "^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"[^\"]+\"" tools/fetchlibs/spec.go \
            | grep -oE '"[^"]+"' | tr -d '"'
        }
        # `|| true` on each: under `set -e` an assignment takes the exit status
        # of its substitution, so a grep that matches nothing would kill the
        # step here with a bare exit 1 and the message below would never print.
        ort=$(read_const ortVersion || true)
        ver=$(read_const tokenizersVersion || true)
        tgt=$(read_const tokenizersTarget || true)
        if [ -z "$ort" ] || [ -z "$ver" ] || [ -z "$tgt" ]; then
          echo "::error::could not read ortVersion/tokenizersVersion/tokenizersTarget from tools/fetchlibs/spec.go"
          echo "tokenizersTarget IS part of the native-lib cache key, and all three are what" >&2
          echo "the cached libs are. If they were renamed or moved, fix this step — do not" >&2
          echo "let the key silently lose a component." >&2
          exit 1
        fi
        echo "ort $ort, tokenizers $ver for $tgt"
        echo "TOKENIZERS_TARGET=$tgt" >> "$GITHUB_ENV"

    # ----------------------------------------------------------- native libs
    # From here down every step runs on ALL THREE platforms.

    # Native libs live under the per-platform dir, dist/<goos>-<goarch>/lib.
    # This step resolves that dir once and publishes it twice, because the two
    # consumers cannot use the same spelling:
    #
    #   LIBDIR      absolute, for `make setup` and anything downstream.
    #   LIBDIR_REL  workspace-relative, for the cache path below. actions/cache
    #               keys its entries on paths relative to GITHUB_WORKSPACE, and
    #               a relative path is the spelling that is identical on all
    #               three runners — notably it is byte-for-byte the
    #               `dist/windows-amd64/lib` this step replaced on Windows, so
    #               extending the cache did not move the Windows entry.
    #
    # The Windows conversion for LIBDIR is not decoration. In a `shell: bash`
    # step $PWD is an MSYS path — /d/a/knomit/knomit — and every tool in this
    # repo is a Windows process that cannot open it. `cygpath -m` is the named
    # conversion: it yields D:/a/knomit/knomit, which Go handles (forward
    # slashes are fine on Windows; the missing drive letter is what is fatal).
    # It is spelled this way rather than `pwd -W` because cygpath exists in
    # both Git bash and MSYS2 bash, so the line survives a shell change.
    # LIBDIR_REL needs no conversion: it never leaves the actions runtime.
    #
    # IT RUNS BEFORE THE RESTORE, and that ordering is load-bearing — the cache
    # path is ${{ env.LIBDIR_REL }}, and an env var only reaches the expression
    # context of steps that come after the step that wrote it.
    - name: Resolve native lib dir
      shell: bash
      run: |
        set -euo pipefail
        root=$PWD
        if [ "$RUNNER_OS" = Windows ]; then root=$(cygpath -m "$PWD"); fi
        rel="dist/$(go env GOOS)-$(go env GOARCH)/lib"
        echo "LIBDIR=$root/$rel" >> "$GITHUB_ENV"
        echo "LIBDIR_REL=$rel" >> "$GITHUB_ENV"
        # The cache key's platform component. GOOS-GOARCH rather than
        # runner.os/runner.arch because it is the same pair that NAMES the
        # directory being cached, so the key cannot drift from its contents.
        # On Windows the pinned Rust target joins it — see below.
        slug="$(go env GOOS)-$(go env GOARCH)"
        if [ "$RUNNER_OS" = Windows ]; then
          if [ -z "${TOKENIZERS_TARGET:-}" ]; then
            echo "::error::TOKENIZERS_TARGET is unset; 'Read pinned native-lib versions' must run before this step"
            echo "It is a component of the Windows cache key. Reordering these two steps would" >&2
            echo "silently key the cache on the platform alone, which an MSVC-target .lib and a" >&2
            echo "GNU-target .a cannot be told apart by." >&2
            exit 1
          fi
          slug="$slug-$TOKENIZERS_TARGET"
        fi
        echo "NATIVE_LIBS_SLUG=$slug" >> "$GITHUB_ENV"

    # Caches the whole per-platform lib dir. On Windows that is onnxruntime.dll
    # (a ~100MB zip to download and unpack) and libtokenizers.a (~5 minutes of
    # cargo, cold); on ubuntu and macos it is the same two libraries, both
    # downloaded from GitHub releases. fetchlibs skips any library whose dest
    # already exists, so a hit means neither download happens.
    #
    # WHY THIS IS NO LONGER WINDOWS-ONLY. It was, on the reasoning that the
    # cargo build is what costs real time and a download is cheap. That is true
    # about TIME and false about RELIABILITY: two unconditional downloads from
    # the release CDN on every ubuntu and macos job are two chances per job for
    # a 5xx to red the build, which is exactly what happened in job
    # 105443136472. fetchlibs now retries (tools/fetchlibs/main.go), and this
    # cache is the other half — a hit means there is nothing to retry.
    #
    # THE KEY. Platform + the hash of tools/fetchlibs/spec.go, which is the
    # single source of truth for the ORT release (1.24.3), the pinned
    # tokenizers tag (v1.27.0) and the Rust target triple. Hashing it moves the
    # key exactly when the fetch plan moves. The cost is a cold rebuild when
    # only its prose changes — #212 edited those comments twice — and that is
    # the right side to err on: the failure it rules out is a cache that keeps
    # serving a lib built at a different pin.
    #
    # On Windows the triple is ALSO named in the key, via NATIVE_LIBS_SLUG. It
    # is redundant with the hash and it is the one component whose staleness
    # would be invisible: an MSVC-target .lib and a GNU-target .a are both
    # called libtokenizers.a, and only one of them links against mingw's ld.
    # ubuntu and macos download a published artifact and never run cargo, so
    # there is no target to pin there and the unix key does not carry one —
    # which is why "Read pinned native-lib versions" stays Windows-only.
    #
    # ONE-TIME COST, PAID ON MERGE: the Windows key gained its GOARCH
    # (native-libs-windows-… became native-libs-windows-amd64-…), so the
    # existing 15.6 MiB entry was abandoned and the first Windows run after
    # this landed paid a cold ~2m40s bootstrap. The alternative was keeping a
    # literal "windows" special case in the key forever to preserve one cache
    # entry, which is a one-off migration encoded permanently into the build.
    #
    # NO restore-keys, deliberately. A prefix-matched restore would hand this
    # job a lib built at a DIFFERENT pin, and skip-if-exists means fetchlibs
    # would never correct it — a green job linking the wrong native library,
    # which is worse than the 5 minutes it saved.
    #
    # restore + save rather than the combined actions/cache, so the save can
    # sit HERE — at the end of this action, before either calling job runs a
    # single test — instead of in a post step that fires after them. That
    # placement is the whole point: a red `go test` later cannot reach back and
    # skip a step that already ran, so a failing suite keeps the cargo build
    # without any `always()` on the save, and a failure INSIDE this action
    # (cargo dying on the CRT mismatch above, say) correctly saves nothing.
    # Saving a half-built lib dir would be the worst outcome available here:
    # cache keys are immutable, so a dir holding only onnxruntime.dll would hit
    # forever, skip the rustup guard, rebuild libtokenizers.a every run, and
    # never re-save.
    - name: Restore native libs
      id: native-libs-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.LIBDIR_REL }}
        key: native-libs-${{ env.NATIVE_LIBS_SLUG }}-${{ hashFiles('tools/fetchlibs/spec.go') }}

    # A ~1s no-op on today's image, which installs this target at image build
    # time (Install-Rust.ps1 runs `rustup target add x86_64-pc-windows-gnu` on
    # the x64 branch) — kept as a guard against that changing, because the
    # failure it prevents is a wall of undefined references from cargo rather
    # than a missing-target message. rustup's default HOST is still MSVC, which
    # is why spec.go passes --target explicitly; nothing here depends on the
    # host triple.
    #
    # Skipped on a cache hit: the target is only needed for the cargo build
    # that a hit means we are not doing. That inference holds because the save
    # below is all-or-nothing — a hit is a complete lib dir, never a partial
    # one that would send fetchlibs back to cargo without this guard.
    - name: Rust GNU target (only when the native libs are cold)
      if: runner.os == 'Windows' && steps.native-libs-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null; then
          echo "::error::rustup is not on this runner image; fetchlibs builds libtokenizers.a with cargo"
          echo "Add dtolnay/rust-toolchain before this step." >&2
          exit 1
        fi
        # TOKENIZERS_TARGET comes from spec.go, read above — the same value the
        # cache key carries and the same one fetchlibs will pass to cargo.
        rustup target add "$TOKENIZERS_TARGET"
        rustc --version
        cargo --version

    # `make setup` on all three, Windows included: the image's mingw ships a
    # make.exe on PATH (Install-Mingw64.ps1 copies mingw32-make.exe to it), and
    # the recipe is one line, `go run ./tools/fetchlibs $(LIBDIR)`, with make
    # computing its own relative LIBDIR — no path spelling crosses a shell
    # boundary here. If that make ever turns out not to run the recipe, the
    # Windows branch is `go run ./tools/fetchlibs "$LIBDIR"`, which is the same
    # command with the absolute path resolved above.
    - name: Fetch native libs (ONNX Runtime, libtokenizers.a)
      shell: bash
      run: make setup

    # NO always(). It would buy nothing — this step already runs before any
    # test, so a red suite cannot skip it — and it would cost the cache: a
    # fetch that failed part-way (ort downloaded, cargo dead, or a download
    # that exhausted fetchlibs' retries) would be saved under a key that can
    # never be rewritten. Only on a miss, too, because saving under a key that
    # already exists is a warning and a wasted upload. On a cold key every leg
    # on a platform runs in parallel and races to save that platform's key; the
    # losers log "Unable to reserve cache", which is the loser of a race, not a
    # failure.
    #
    # Same key expression as the restore above. They are two steps rather than
    # one actions/cache for the placement reason given there, so the two key
    # lines have to be edited together — they are deliberately identical text.
    - name: Save native libs
      if: steps.native-libs-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.LIBDIR_REL }}
        key: native-libs-${{ env.NATIVE_LIBS_SLUG }}-${{ hashFiles('tools/fetchlibs/spec.go') }}
