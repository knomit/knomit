# F09 acceptance gate for a knomit knowledge base repository.
#
# Add the `verify` steps below to the repository's merge-agent-branches
# workflow, BEFORE the step that merges the agent branch into main. They run
# `knomit verify ci`, which reads verify_signatures at main's tip FIRST:
#
#   - off or absent (the default): it exits 0 at once and checks nothing. The
#     fleet repository is not needed, and the job behaves exactly as without
#     these steps.
#   - log or enforce: every commit the agent branch adds must be signed by the
#     CURRENT key of an ACTIVE member of the fleet (the member record at the
#     commit author's agent id, in the fleet repository's main). In enforce a
#     failure fails the job (exit 1) and the branch is not merged; in log it is
#     reported and the job passes. A missing or unreadable fleet, while
#     verification is on, is exit 2.
#
# Inputs, set once per repository:
#   - Repository variable KNOMIT_FLEET_URL: the fleet repository to clone (the
#     knomit repository whose ontology is the fleet preset). Needed only when
#     verification is on.
#   - Repository secret KNOMIT_FLEET_TOKEN (optional): a read token, if the
#     fleet repository is private.
#   - KNOMIT_VERSION below: a knomit release that has `knomit verify ci`.
#
# A commit accepted here is never re-checked: this job is where a change is
# verified, once. `knomit verify audit` re-checks a whole branch on demand.

      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Check out the fleet repository
        if: ${{ vars.KNOMIT_FLEET_URL != '' }}
        env:
          KNOMIT_FLEET_URL: ${{ vars.KNOMIT_FLEET_URL }}
          KNOMIT_FLEET_TOKEN: ${{ secrets.KNOMIT_FLEET_TOKEN }}
        run: |
          set -euo pipefail
          url="$KNOMIT_FLEET_URL"
          if [ -n "${KNOMIT_FLEET_TOKEN:-}" ]; then
            url="https://x-access-token:${KNOMIT_FLEET_TOKEN}@${url#https://}"
          fi
          git clone --quiet "$url" "$RUNNER_TEMP/fleet"

      - name: Verify commit signatures (F09)
        env:
          KNOMIT_VERSION: "SET-ME" # the first knomit release with `knomit verify ci --fleet`; the download fails loudly until set
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          curl -fsSL -o knomit.tar.gz \
            "https://github.com/knomit/knomit/releases/download/v${KNOMIT_VERSION}/knomit-${KNOMIT_VERSION}-linux-amd64.tar.gz"
          mkdir -p .knomit-bin && tar -xzf knomit.tar.gz -C .knomit-bin
          KNOMIT=$(find .knomit-bin -type f -name knomit -perm -u+x | head -1)
          fleet=()
          if [ -d "$RUNNER_TEMP/fleet" ]; then fleet=(--fleet "$RUNNER_TEMP/fleet"); fi
          "$KNOMIT" verify ci --dir . --upstream origin/main --candidate "origin/$BRANCH" "${fleet[@]}"
