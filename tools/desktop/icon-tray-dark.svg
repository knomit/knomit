<!-- Tray icon for a DARK menu bar: the app-icon art (web/public/logo.svg) with
     the green diamond recolored white and the graph kept dark. This is the
     "appicon without the green". Shown on dark menu bars (light icon → high
     contrast). Regenerate the PNG with `make desktop-icons`. -->
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <rect x="12" y="12" width="56" height="56" rx="10" transform="rotate(45 40 40)" fill="#ffffff"/>
  <line x1="30" y1="24" x2="30" y2="56" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <path d="M30 40 Q38 36 50 24" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M30 40 Q38 44 50 56" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="30" cy="24" r="3.5" fill="#111111"/>
  <circle cx="30" cy="56" r="3.5" fill="#111111"/>
  <circle cx="50" cy="24" r="3.5" fill="#111111"/>
  <circle cx="50" cy="56" r="3.5" fill="#111111"/>
  <circle cx="30" cy="40" r="3.5" fill="#111111"/>
</svg>
