# drone configuration. Copy to drone.toml (in the working directory or
# ~/.config/drone/), or point at it with --config <path>.
#
# Precedence, lowest to highest:
#   built-in defaults  <  this file  <  DRONE_* env vars  <  command-line flags
#
# Every key below can also be set as an env var by upper-casing, prefixing
# DRONE_, and replacing "." with "_":  sandbox.enabled -> DRONE_SANDBOX_ENABLED.

# Implementation plan to execute. Usually passed on the CLI (--plan), but may
# be pinned here for a repeatable run.
# plan = ".claude/plans/my-plan.md"

repo   = "."     # git repository to work in
base   = "dev"   # branch the PR targets
branch = ""      # working branch; empty => auto/<plan>-<ksuid>

# Repo-relative paths symlinked from the main checkout into the fresh worktree.
# A worktree only has tracked files, so a gitignored build dir a project MCP
# server runs from (e.g. dist/knomit-bridge) would otherwise be missing.
# link = ["dist"]
model  = "opus"  # claude --model alias or full id
budget = 0       # max USD to spend; 0 = unlimited
yes    = false   # true => skip the pre-flight countdown

# Base directory for audit artifacts. Each run gets its own subfolder named
# after the instance: <log_dir>/<plan>-<ksuid>/drone-<ts>.{jsonl,stderr.log,prompt.txt}.
# Relative paths resolve against `repo`.
log_dir   = ".claude/drone"
log_level = "info"  # trace | debug | info | warn | error

[sandbox]
enabled = true
# allow_local lets the sandbox reach localhost/looknomitck (e.g. a local MCP server
# such as the knomit bridge on 127.0.0.1:19278). allowedDomains never covers
# looknomitck, so set this false only if you want to deny localhost entirely.
allow_local = true
# Extra entries are APPENDED to the built-in defaults (GitHub + Go module proxy
# for domains; the worktree, <repo>/.git, /tmp, ~/.knomit, ~/.claude, and the Go
# caches for writes).
# Via env vars these are comma-separated: DRONE_SANDBOX_ALLOW_DOMAINS=a.com,b.com
allow_domains = []
allow_write   = []
